<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta
      name="description"
      content="日本の経理を学ぶためのローカル LLM 付き学習サイト。仕訳・帳簿・決算・税務をインタラクティブに学べ、ブラウザ内で動く AI が解説やリアクションで手伝います。"
    />
    <meta name="theme-color" content="#f8fafc" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#212121" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <title>LLLM 経理</title>
    <script>
      // 初回描画前にテーマを適用してちらつきを防ぐ
      try {
        var s = JSON.parse(localStorage.getItem('lllm-keiri:settings') || '{}').state || {};
        var t = s.theme || 'system';
        document.documentElement.dataset.darkPalette = s.darkPalette || 'neutral';
        if (
          t === 'dark' ||
          (t === 'system' && matchMedia('(prefers-color-scheme: dark)').matches)
        ) {
          document.documentElement.classList.add('dark');
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
