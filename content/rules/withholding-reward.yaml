id: withholding-reward-rate
title: 報酬・料金の源泉徴収の税率（100 万円以下の部分）
unit: percent
description: 原稿料・講演料・デザイン料・税理士などの報酬を個人に払うときの源泉徴収の税率。2013 年からは復興特別所得税（所得税額の 2.1%）を含む。100 万円を超える部分はこの 2 倍
basis:
  - name: 所得税法 第 204 条・第 205 条
  - name: 復興特別所得税（2013 年 1 月 1 日から 2037 年 12 月 31 日までの支払い）
values:
  - from: '2013-01-01'
    to: '2037-12-31'
    value: 10.21
    note: 所得税 10% ＋ 復興特別所得税 0.21%
