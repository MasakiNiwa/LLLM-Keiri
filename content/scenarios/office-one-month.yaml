id: office-one-month
title: 小さな会社の 1 か月（経費精算・請求・給与・月次決算）
summary: 前月からの残高を入れたあと、5 月の経費精算・入金消込・給料と預り金の納付・月次決算の見越し計上まで。月末の試算表で、預り金や未払費用の残高を確かめましょう（消費税と商品の棚卸は省略）
level: 2
entries:
  - date: '2026-05-01'
    memo: 4 月末の残高（前月からの繰越。4 月分の給料から預かった税金・社会保険料と、会社負担の社会保険料の見越しを含む）
    shiwake: |
      普通預金 2,000,000 / 買掛金 300,000
      現金 50,000 / 所得税預り金 7,000
      売掛金 600,000 / 預り金 12,000
      備品 1,200,000 / 社会保険料預り金 45,000
      / 未払費用 45,000
      / 借入金 1,000,000
      / 資本金 2,000,000
      / 繰越利益剰余金 441,000
  - date: '2026-05-01'
    memo: 5 月分の事務所の家賃を支払い
    shiwake: 支払家賃 150,000 / 普通預金 150,000
  - date: '2026-05-07'
    memo: 出張の前に、旅費の概算を現金で渡した（仮払い）
    shiwake: 仮払金 50,000 / 現金 50,000
  - date: '2026-05-08'
    memo: 4 月分の給料から預かった源泉所得税と住民税を納付
    shiwake: |
      所得税預り金 7,000 / 普通預金 19,000
      預り金 12,000 /
  - date: '2026-05-12'
    memo: 出張の精算（旅費 46,000 円。残りの現金 4,000 円を受け取った）
    shiwake: |
      旅費交通費 46,000 / 仮払金 50,000
      現金 4,000 /
  - date: '2026-05-15'
    memo: 商品を掛けで仕入れ（6 月末払い）
    shiwake: 仕入 300,000 / 買掛金 300,000
  - date: '2026-05-15'
    memo: A 社へ商品を掛けで販売（6 月末に入金予定）
    shiwake: 売掛金 1,200,000 / 売上 1,200,000
  - date: '2026-05-20'
    memo: 4 月分の売掛金 600,000 円の入金（振込手数料 660 円は当社負担の取り決めで差し引かれていた）
    shiwake: |
      普通預金 599,340 / 売掛金 600,000
      支払手数料 660 /
