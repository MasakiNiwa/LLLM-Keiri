id: company-first-year
title: 小さな会社の 1 年（取引から決算・申告の準備まで）
summary: 設立・借入れ・備品の購入から、四半期ごとの売上・仕入・家賃・給料と預り金の納付、決算整理（棚卸・減価償却・貸倒引当金・消費税・法人税等）まで。税抜経理。1 年分の帳簿がどうできあがるかを通しで見られます
level: 3
