id: shop-first-year-closing
title: 雑貨店の 1 年目と決算整理
summary: 1 年分の取引をまとめて入れたあと、売上原価・減価償却・貸倒引当金・前払費用・未払費用の決算整理まで（消費税は省略）
level: 2
