id: year-end-drill
title: 年末調整と年次業務の仕訳
track: practice
order: 3
level: 3
summary: 年末調整の還付と不足、精算後の源泉所得税の納付、償却資産の固定資産税の 4 問
tags: [年末調整, 所得税預り金, 還付, 固定資産税]
basis:
  - name: 所得税法 第 190 条（年末調整）・第 191 条（過納額の還付）・第 192 条（不足額の徴収）
asOf: '2026-10-01'
updated: '2026-10-18'
questions:
  - id: q1
    question: 12 月の給料日に、年末調整で計算した還付額 24,000 円を、給料の振込みに上乗せして普通預金から返した。
    answer: 所得税預り金 24,000 / 普通預金 24,000
    explanation: 還付は、預かっていた源泉所得税を返すことなので、所得税預り金を減らします。
  - id: q2
    question: 年末調整で 8,000 円の不足額が出たので、12 月の給料の支払いのときに、普通預金から振り込む額を減らして差し引いた（不足額の徴収分だけを記録する）。
    answer: 普通預金 8,000 / 所得税預り金 8,000
    hint: 振り込む額が減った分、預かる源泉所得税が増えます。
    explanation: 追加で差し引いた分は、納めるまで所得税預り金（負債）です。
  - id: q3
    question: 翌年 1 月 10 日、12 月分の源泉所得税（年末調整後）95,000 円を普通預金から納付した。
    answer: 所得税預り金 95,000 / 普通預金 95,000
    explanation: 年末調整で精算したあとの源泉所得税を、翌月 10 日までに納めます。
  - id: q4
    question: 固定資産税（償却資産）の第 1 期分 45,000 円を普通預金から納付した。
    answer: 租税公課 45,000 / 普通預金 45,000
    explanation: 固定資産税は、所得にかかる税金ではないので、租税公課（費用）にします。
