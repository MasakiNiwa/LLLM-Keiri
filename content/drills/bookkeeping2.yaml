questions:
  - id: q1
    question: 得意先から受け取っていた約束手形 300,000 円を銀行で割り引き、割引料 3,500 円を差し引かれた額が当座預金に入金された。
    answer: |
      当座預金 296,500 / 受取手形 300,000
      手形売却損 3,500 /
    explanation: 割引料は手形売却損（営業外費用）。手形の額面はすべて減らします。
  - id: q2
    question: 仕入先への買掛金 200,000 円の支払いのため、持っていた約束手形を裏書して渡した。
    answer: 買掛金 200,000 / 受取手形 200,000
    explanation: 手形を渡したので受取手形が減り、買掛金の支払いが済みます。
  - id: q3
    question: 得意先への売掛金 250,000 円について、電子記録債権の発生記録が行われた。
    answer: 電子記録債権 250,000 / 売掛金 250,000
    explanation: 売掛金が電子記録債権に置き換わります。
  - id: q4
    question: 売買目的で D 社株式 1,000 株を 1 株 800 円で買い、手数料 8,000 円とあわせて普通預金から支払った。
    answer: 売買目的有価証券 808,000 / 普通預金 808,000
    explanation: 手数料も取得原価に含めます。
  - id: q5
    question: 上の D 社株式のうち 500 株を 1 株 850 円で売り、代金は普通預金に入金された（帳簿価額は 1 株 808 円）。
    answer: |
      普通預金 425,000 / 売買目的有価証券 404,000
      / 有価証券売却益 21,000
    explanation: 帳簿価額 808 × 500 ＝ 404,000 円との差 21,000 円が有価証券売却益です。
  - id: q6
    question: 決算で、売買目的有価証券（帳簿価額 404,000 円）の時価が 390,000 円だった。
    answer: 有価証券評価損 14,000 / 売買目的有価証券 14,000
    explanation: 時価に評価替えし、差額 14,000 円は有価証券評価損にします。
  - id: q7
    question: 決算で、その他有価証券（取得原価 600,000 円）の時価が 650,000 円だった。全部純資産直入法により、税効果は考えない。
    answer: その他有価証券 50,000 / その他有価証券評価差額金 50,000
    explanation: その他有価証券の評価差額は、損益ではなく純資産（その他有価証券評価差額金）にします。
  - id: q8
    question: 備品（取得原価 400,000 円・期首の減価償却累計額 160,000 円・1 年分の減価償却費 80,000 円）を、期首から 3 か月使ったところで 200,000 円で売り、代金は翌月に受け取ることにした。
    answer: |
      減価償却累計額 160,000 / 備品 400,000
      減価償却費 20,000 /
      未収入金 200,000 /
      固定資産売却損 20,000 /
    hint: 当期の減価償却費は 80,000 × 3/12 です。
    explanation: 当期の減価償却費は 80,000 × 3/12 ＝ 20,000 円。帳簿価額は 400,000 − 160,000 − 20,000 ＝ 220,000 円で、売却額 200,000 円より 20,000 円低く売ったので固定資産売却損です。代金の後受けは未収入金です。
  - id: q9
    question: ファイナンス・リース取引で、車両を借りた。見積現金購入価額は 1,500,000 円で、利子抜き法による。
    answer: リース資産 1,500,000 / リース債務 1,500,000
    explanation: 利子抜き法では、利息を含まない見積現金購入価額で、リース資産とリース債務を計上します。
  - id: q10
    question: 【本店】支店へ現金 60,000 円を送った。
    answer: 支店 60,000 / 現金 60,000
    explanation: 本店の帳簿では、支店との貸し借りを「支店」の勘定で記録します。支店の帳簿では「現金 60,000 / 本店 60,000」です。
