id: trade-receivables
title: 債権と債務
track: trade
order: 3
level: 1
summary: 売掛金と未収入金、買掛金と未払金、前払・前受、仮払・仮受の使い分け 10 問
tags: [未収入金, 未払金, 前払金, 前受金, 仮払金, 仮受金]
basis:
  - name: 企業会計原則
asOf: '2026-10-01'
updated: '2026-10-17'
questions:
  - id: q1
    question: 営業用の車 1,800,000 円を買い、代金は翌月に支払うことにした。
    answer: 車両運搬具 1,800,000 / 未払金 1,800,000
    hint: 商品以外のものを後払いで買いました。
    explanation: 商品以外の代金の後払いは未払金です。買掛金は商品の仕入にだけ使います。
  - id: q2
    question: 使わなくなった備品（帳簿価額 30,000 円）を 30,000 円で売り、代金は月末に受け取ることにした。
    answer: 未収入金 30,000 / 備品 30,000
    explanation: 商品以外を売った代金の後受けは未収入金です。
  - id: q3
    question: 商品を注文し、内金 20,000 円を現金で支払った。
    answer: 前払金 20,000 / 現金 20,000
    explanation: 商品を受け取る前に払った内金は前払金（資産）です。
  - id: q4
    question: 注文していた商品 100,000 円を受け取り、内金 20,000 円を差し引いた残りは掛けとした。
    answer: |
      仕入 100,000 / 前払金 20,000
      / 買掛金 80,000
    explanation: 払っておいた内金（前払金）を代金に充て、残りを買掛金にします。
  - id: q5
    question: 得意先から注文を受け、内金 30,000 円を現金で受け取った。
    answer: 現金 30,000 / 前受金 30,000
    explanation: 商品を渡す前に受け取った内金は前受金（負債）です。
  - id: q6
    question: 注文の商品 150,000 円を渡し、内金 30,000 円を差し引いた残りは掛けとした。
    answer: |
      前受金 30,000 / 売上 150,000
      売掛金 120,000 /
    explanation: 受け取っていた内金（前受金）を代金に充て、残りを売掛金にします。
  - id: q7
    question: 出張する社員に、旅費の概算として現金 30,000 円を渡した。
    answer: 仮払金 30,000 / 現金 30,000
    hint: 金額がまだ確定していない支払いです。
    explanation: 内容や金額が確定していない支払いは仮払金にします。
  - id: q8
    question: 社員が出張から戻り、旅費 26,000 円を精算して、残りの現金を受け取った（概算払い 30,000 円）。
    answer: |
      旅費交通費 26,000 / 仮払金 30,000
      現金 4,000 /
    explanation: 仮払金を取り崩し、実際の旅費と、戻ってきた現金に分けます。
  - id: q9
    question: 普通預金に 70,000 円の入金があったが、内容がわからない。
    answer: 普通預金 70,000 / 仮受金 70,000
    explanation: 内容のわからない入金は仮受金（負債）で一時的に記録します。
  - id: q10
    question: 上の入金は、売掛金の回収だとわかった。
    answer: 仮受金 70,000 / 売掛金 70,000
    explanation: 仮受金を取り崩して、正しい科目（売掛金の減少）に振り替えます。
