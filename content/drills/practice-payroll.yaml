id: practice-payroll-drill
title: 給与計算と計上（見越し・預り金・賞与・年度更新）
track: practice
order: 2
level: 3
summary: 給料の見越し計上と支払い、会社負担の社会保険料、預り金の納付、賞与と賞与引当金、通勤手当の 8 問
tags: [給与計算, 未払費用, 預り金, 法定福利費, 賞与]
basis:
  - name: 企業会計原則（発生主義）
  - name: 所得税法・健康保険法・厚生年金保険法
asOf: '2026-10-01'
updated: '2026-10-18'
questions:
  - id: q1
    question: 3 月 31 日の決算で、4 月 25 日に支払う 3 月分の給料 500,000 円を見越し計上する。
    answer: 給料 500,000 / 未払費用 500,000
    explanation: 当期に働いた分なので、支払いが来期でも当期の費用にします。
  - id: q2
    question: 4 月 25 日、上の 3 月分の給料 500,000 円を支払った。社会保険料 70,000 円・源泉所得税 12,000 円・住民税 20,000 円を差し引き、残りを普通預金から振り込んだ。
    answer: |
      未払費用 500,000 / 社会保険料預り金 70,000
      / 所得税預り金 12,000
      / 預り金 20,000
      / 普通預金 398,000
    explanation: 見越し計上した未払費用を取り崩し、差し引いた額は納めるまで預り金にします。
  - id: q3
    question: 月末に、当月分の会社負担の社会保険料 70,000 円を見越し計上する（翌月末に納付）。
    answer: 法定福利費 70,000 / 未払費用 70,000
    explanation: 当月分の会社負担を当月の費用にするため、法定福利費を見越し計上します。
  - id: q4
    question: 翌月末、社会保険料 140,000 円（本人分 70,000 円・会社負担分 70,000 円。会社負担分は見越し計上済み）が普通預金から引き落とされた。
    answer: |
      社会保険料預り金 70,000 / 普通預金 140,000
      未払費用 70,000 /
    explanation: 本人分は預り金を、会社負担分は見越し計上した未払費用を取り崩します。
  - id: q5
    question: 給料のうち通勤手当 15,000 円（非課税の範囲内）を、給料とは別に旅費交通費として、現金で支払った。
    answer: 旅費交通費 15,000 / 現金 15,000
    explanation: 通勤手当は旅費交通費（または給料）で処理します。所得税はかかりませんが、社会保険料・雇用保険料の計算には含めます。
  - id: q6
    question: 決算で、6 月に支給する賞与のうち当期分 900,000 円を見越して、賞与引当金を計上する。
    answer: 賞与引当金繰入 900,000 / 賞与引当金 900,000
    explanation: 当期に働いた分の賞与を見積もって費用にします。
  - id: q7
    question: 6 月に賞与 1,200,000 円を支給した。賞与引当金 900,000 円を取り崩し、社会保険料 170,000 円・源泉所得税 95,000 円を差し引いて、残りを普通預金から振り込んだ。
    answer: |
      賞与引当金 900,000 / 社会保険料預り金 170,000
      賞与 300,000 / 所得税預り金 95,000
      / 普通預金 935,000
    explanation: 引当金を取り崩し、足りない 300,000 円は当期の賞与（費用）にします。
  - id: q8
    question: 7 月 10 日、6 月の給料・賞与から差し引いた源泉所得税 107,000 円と住民税 20,000 円を普通預金から納付した。
    answer: |
      所得税預り金 107,000 / 普通預金 127,000
      預り金 20,000 /
    explanation: 預かった税金を納めるので、預り金を減らします。
