id: cost-drill
title: 工業簿記の仕訳（材料・賃金・製造間接費・完成・差異）
track: cost
order: 1
level: 3
summary: 材料の購入と消費、賃金の消費、製造間接費の予定配賦と配賦差異、完成と販売、標準原価の差異の 10 問
tags: [工業簿記, 材料, 賃金, 製造間接費, 仕掛品, 製品, 原価差異]
basis:
  - name: 原価計算基準
asOf: '2026-10-01'
updated: '2026-10-18'
questions:
  - id: q1
    question: 材料 500,000 円を掛けで買った。
    answer: 材料 500,000 / 買掛金 500,000
    explanation: 買った材料は、消費するまで材料（資産）にします。
  - id: q2
    question: 材料を消費した。直接材料費 380,000 円、間接材料費 40,000 円。
    answer: |
      仕掛品 380,000 / 材料 420,000
      製造間接費 40,000 /
    explanation: 直接材料費は仕掛品、間接材料費は製造間接費に振り替えます。
  - id: q3
    question: 賃率 @1,200 円で、直接作業時間 400 時間、間接作業時間 50 時間の賃金を消費した。
    answer: |
      仕掛品 480,000 / 賃金 540,000
      製造間接費 60,000 /
    hint: 賃率 × 時間で計算します。
    explanation: 直接労務費 1,200 × 400 ＝ 480,000 円は仕掛品、間接労務費 1,200 × 50 ＝ 60,000 円は製造間接費です。
  - id: q4
    question: 製造間接費を、予定配賦率 @600 円 × 直接作業時間 400 時間で仕掛品に予定配賦した。
    answer: 仕掛品 240,000 / 製造間接費 240,000
    explanation: 予定配賦額 600 × 400 ＝ 240,000 円を仕掛品に配賦します。
  - id: q5
    question: 月末、製造間接費の実際発生額は 250,000 円だった（予定配賦額 240,000 円）。配賦差異を原価差異に振り替える。
    answer: 原価差異 10,000 / 製造間接費 10,000
    explanation: 実際のほうが 10,000 円多い不利差異です。製造間接費の借方に残った 10,000 円を原価差異（借方）に振り替えます。
  - id: q6
    question: 当月の完成品原価は 1,050,000 円だった。
    answer: 製品 1,050,000 / 仕掛品 1,050,000
    explanation: 完成した分を、仕掛品から製品に振り替えます。
  - id: q7
    question: 製品（原価 700,000 円）を 1,000,000 円で掛けで売った。
    answer: |
      売掛金 1,000,000 / 売上 1,000,000
      売上原価 700,000 / 製品 700,000
    explanation: 売上を計上し、売れた製品の原価を製品から売上原価に振り替えます。
  - id: q8
    question: 外注先に加工賃 80,000 円を普通預金から支払った（製品 A の直接経費）。
    answer: 仕掛品 80,000 / 普通預金 80,000
    explanation: 特定の製品のための外注加工賃は直接経費なので、仕掛品に直接集めます。
  - id: q9
    question: 予定価格 @300 円で材料 1,000 個を消費していた（すべて直接材料）。実際の消費額は 310,000 円だった。材料消費価格差異を原価差異に振り替える。
    answer: 原価差異 10,000 / 材料 10,000
    explanation: 予定価格での消費額は 300,000 円。実際は 310,000 円なので、不利差異 10,000 円を原価差異（借方）にします。
  - id: q10
    question: 会計年度末、原価差異の借方残高 25,000 円を売上原価に振り替えた。
    answer: 売上原価 25,000 / 原価差異 25,000
    explanation: 原価差異は、原則として年度末に売上原価に振り替えます（不利差異は売上原価を増やす）。
