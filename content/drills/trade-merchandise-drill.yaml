id: trade-merchandise-drill
title: 商品売買（三分法）
track: trade
order: 1
level: 1
summary: 仕入・売上・返品・付随費用など、商品売買の仕訳 10 問
tags: [三分法, 仕入, 売上, 返品]
basis:
  - name: 企業会計原則
asOf: '2026-10-01'
updated: '2026-10-17'
questions:
  - id: q1
    question: 商品 80,000 円を仕入れ、代金は掛けとした。
    answer: 仕入 80,000 / 買掛金 80,000
    explanation: 三分法では仕入（費用）で記録します。後で払う代金は買掛金（負債）です。
  - id: q2
    question: 商品を 120,000 円で売り、代金は掛けとした。
    answer: 売掛金 120,000 / 売上 120,000
    explanation: 売上（収益）は売価で記録します。後で受け取る代金は売掛金（資産）です。
  - id: q3
    question: 商品 50,000 円を仕入れ、代金は現金で支払った。
    answer: 仕入 50,000 / 現金 50,000
    explanation: 仕入（費用）の発生は借方、現金（資産）の減少は貸方です。
  - id: q4
    question: 商品を 30,000 円で売り、代金は現金で受け取った。
    answer: 現金 30,000 / 売上 30,000
    explanation: 現金（資産）の増加は借方、売上（収益）の発生は貸方です。
  - id: q5
    question: 商品 60,000 円を掛けで仕入れ、引取運賃 1,500 円を現金で支払った。
    answer: |
      仕入 61,500 / 買掛金 60,000
      / 現金 1,500
    hint: 仕入にかかった運賃は、仕入の原価に含めます。
    explanation: 引取運賃などの付随費用は仕入に含めるので、仕入は 61,500 円です。
  - id: q6
    question: 商品 40,000 円を掛けで売り、当社負担の送料 800 円を現金で支払った。
    answer: |
      売掛金 40,000 / 売上 40,000
      発送費 800 / 現金 800
    hint: 売るときに当社が負担する送料は、売上とは別の費用です。
    explanation: 当社負担の送料は発送費（費用）にします。売上は 40,000 円のままです。
  - id: q7
    question: 掛けで仕入れた商品のうち 5,000 円分が品違いだったため返品した。
    answer: 買掛金 5,000 / 仕入 5,000
    hint: 仕入れたときの仕訳の逆です。
    explanation: 仕入戻しは、仕入の逆仕訳で取り消します。買掛金も減ります。
  - id: q8
    question: 掛けで売った商品のうち 8,000 円分が返品された。
    answer: 売上 8,000 / 売掛金 8,000
    explanation: 売上戻りは、売上の逆仕訳で取り消します。売掛金も減ります。
  - id: q9
    question: 買掛金 80,000 円を普通預金から支払った。
    answer: 買掛金 80,000 / 普通預金 80,000
    explanation: 買掛金（負債）の減少は借方、普通預金（資産）の減少は貸方です。
  - id: q10
    question: 売掛金 120,000 円が普通預金に振り込まれた。
    answer: 普通預金 120,000 / 売掛金 120,000
    explanation: 普通預金（資産）の増加は借方、売掛金（資産）の減少は貸方です。
