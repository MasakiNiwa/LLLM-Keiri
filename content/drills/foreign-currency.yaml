id: foreign-currency
title: 外貨建取引と為替差損益
track: consolidation
order: 2
level: 3
summary: 輸出入の記録・決済・決算時の換算替え・前払金の充当など、ドル建て取引の仕訳 6 問
tags: [外貨建取引, 為替差損益]
basis:
  - name: 外貨建取引等会計処理基準
asOf: '2026-10-01'
updated: '2026-10-18'
questions:
  - id: q1
    question: 商品 1,000 ドルを輸出し、代金は掛けとした（1 ドル 150 円）。
    answer: 売掛金 150,000 / 売上 150,000
    explanation: 取引の日のレートで換算します。
  - id: q2
    question: 上の売掛金 1,000 ドル（150,000 円で記録）を回収し、普通預金に入金した（1 ドル 145 円）。
    answer: |
      普通預金 145,000 / 売掛金 150,000
      為替差損 5,000 /
    explanation: 円高で受け取る円が 5,000 円減ったので為替差損です。
  - id: q3
    question: 商品 500 ドルを輸入し、代金は掛けとした（1 ドル 148 円）。
    answer: 仕入 74,000 / 買掛金 74,000
    explanation: 500 × 148 ＝ 74,000 円。
  - id: q4
    question: 上の買掛金 500 ドル（74,000 円で記録）が期末に残っている。決算日のレートは 1 ドル 150 円である。
    answer: 為替差損 1,000 / 買掛金 1,000
    explanation: 500 × 150 ＝ 75,000 円。支払う円が 1,000 円増えるので、買掛金を増やして為替差損にします。
  - id: q5
    question: 期末に、ドル建ての売掛金 2,000 ドル（290,000 円で記録）が残っている。決算日のレートは 1 ドル 150 円である。
    answer: 売掛金 10,000 / 為替差益 10,000
    explanation: 2,000 × 150 ＝ 300,000 円。受け取る円が増えるので為替差益です。
  - id: q6
    question: 商品 1,000 ドルを輸入した。100 ドルは前払金（払ったときのレート 1 ドル 150 円）を充て、残り 900 ドルは掛けとした（1 ドル 145 円）。
    answer: |
      仕入 145,500 / 前払金 15,000
      / 買掛金 130,500
    hint: 前払金の分は、前払金を払った日のレートのままです。
    explanation: 前払金 15,000 円＋ 900 × 145 ＝ 130,500 円で、仕入は 145,500 円です。
