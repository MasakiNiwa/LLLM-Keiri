id: trade-cash
title: 現金と預金
track: trade
order: 2
level: 1
summary: 小切手・預金の預け替え・現金過不足など、現金と預金の仕訳 8 問
tags: [現金, 小切手, 当座預金, 現金過不足]
basis:
  - name: 企業会計原則
asOf: '2026-10-01'
updated: '2026-10-17'
questions:
  - id: q1
    question: 売掛金 40,000 円の回収として、得意先が振り出した小切手を受け取った。
    answer: 現金 40,000 / 売掛金 40,000
    hint: 他人が振り出した小切手は、すぐにお金にかえられます。
    explanation: 他人振出の小切手は通貨代用証券なので現金として扱います。
  - id: q2
    question: 買掛金 70,000 円を、小切手を振り出して支払った。
    answer: 買掛金 70,000 / 当座預金 70,000
    explanation: 自分で振り出した小切手で支払うと、当座預金が減ります。
  - id: q3
    question: 普通預金から 300,000 円を定期預金に預け替えた。
    answer: 定期預金 300,000 / 普通預金 300,000
    explanation: 資産どうしの入れかえです。増えた定期預金が借方です。
  - id: q4
    question: 金庫の現金を数えたら 48,000 円で、帳簿の残高 50,000 円より 2,000 円少なかった。原因はわからない。
    answer: 現金過不足 2,000 / 現金 2,000
    hint: 帳簿の現金を実際の額に合わせます。原因がわかるまでは一時的な勘定を使います。
    explanation: 現金を 2,000 円減らして実際の額に合わせ、相手は現金過不足にします。
  - id: q5
    question: 上の不足の原因を調べたら、交通費 1,500 円の記帳もれだった。
    answer: 旅費交通費 1,500 / 現金過不足 1,500
    explanation: 原因がわかった分を、正しい科目（旅費交通費）に振り替えます。
  - id: q6
    question: 決算日になっても、残りの不足 500 円の原因はわからなかった。
    answer: 雑損 500 / 現金過不足 500
    explanation: 原因不明の不足は雑損（費用）にします。過剰なら雑益です。
  - id: q7
    question: 金庫の現金が帳簿より 1,000 円多かった。原因はわからない。
    answer: 現金 1,000 / 現金過不足 1,000
    explanation: 現金を増やして実際の額に合わせ、相手は現金過不足（貸方）にします。
  - id: q8
    question: 普通預金の利息 300 円が入金された。
    answer: 普通預金 300 / 受取利息 300
    explanation: 普通預金（資産）の増加は借方、受取利息（収益）の発生は貸方です。
