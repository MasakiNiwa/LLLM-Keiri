id: consolidation-entries
title: 連結修正仕訳
track: consolidation
order: 1
level: 4
summary: 投資と資本の相殺消去・のれん償却・非支配株主への配分・内部取引・債権債務・未実現利益の連結修正仕訳 8 問
tags: [連結, 連結修正仕訳]
basis:
  - name: 連結財務諸表に関する会計基準（企業会計基準第 22 号）
asOf: '2026-10-01'
updated: '2026-10-18'
questions:
  - id: q1
    question: P 社は S 社の株式の 100% を 2,000 で取得した。取得日の S 社の資本は 資本金 1,500・利益剰余金 500 である（時価と帳簿価額は同じ）。投資と資本を相殺消去する。
    answer: |
      資本金 1,500 / 子会社株式 2,000
      利益剰余金 500 /
    explanation: 取得原価と S 社の資本が同じなので、のれんは生じません。
  - id: q2
    question: P 社は S 社の株式の 80% を 3,000 で取得した。取得日の S 社の資本は 資本金 2,000・利益剰余金 1,000 である（時価と帳簿価額は同じ）。投資と資本を相殺消去する。
    answer: |
      資本金 2,000 / 子会社株式 3,000
      利益剰余金 1,000 / 非支配株主持分 600
      のれん 600 /
    hint: 資本 3,000 のうち P 社の持分は 2,400 です。
    explanation: 非支配株主持分は 3,000 × 20% ＝ 600、のれんは 3,000 − 2,400 ＝ 600 です。
  - id: q3
    question: のれん 600 を 10 年で定額法により償却する。
    answer: のれん償却 60 / のれん 60
    explanation: 600 ÷ 10 ＝ 60 を毎期の費用にします。
  - id: q4
    question: S 社（持分 80%）の当期純利益は 500 である。非支配株主の持分を振り替える。
    answer: 非支配株主に帰属する当期純利益 100 / 非支配株主持分 100
    explanation: 500 × 20% ＝ 100 が非支配株主の分です。
  - id: q5
    question: 当期に P 社は S 社に商品を 1,200 販売した。内部取引を消去する。
    answer: 売上 1,200 / 売上原価 1,200
    explanation: グループ内の売上と仕入（売上原価）を両方消します。
  - id: q6
    question: 期末に、P 社の売掛金のうち 300 は S 社に対するものである。債権債務を相殺消去する。
    answer: 買掛金 300 / 売掛金 300
    explanation: グループ内の売掛金と買掛金を相殺します。
  - id: q7
    question: S 社の期末の在庫のうち 400 は P 社から仕入れたものである。P 社の売上総利益率は 30% である。未実現利益を消去する。
    answer: 売上原価 120 / 繰越商品 120
    explanation: 400 × 30% ＝ 120。親会社から子会社への販売（ダウンストリーム）なので全額を消去します。
  - id: q8
    question: S 社（持分 90%）から当期に配当金 100 を受け取り、P 社は受取配当金 90 を計上した。S 社は利益剰余金を 100 減らしている。親会社への配当分を消去する（非支配株主への配当分は考えない）。
    answer: 受取配当金 90 / 利益剰余金 90
    hint: グループ内の配当は、受け取った側の収益と、払った側の利益剰余金の減少を取り消します。
    explanation: P 社への配当 90 はグループ内のお金の移動なので、受取配当金を消し、S 社で減らした利益剰余金を戻します。非支配株主への配当 10 は、別に非支配株主持分を減らします（非支配株主持分 10 / 利益剰余金 10）。
