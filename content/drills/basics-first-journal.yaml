tags: [仕訳, 基本]
basis:
  - name: 企業会計原則
asOf: '2026-10-01'
updated: '2026-10-17'
questions:
  - id: q1
    question: 株主から出資を受け、3,000,000 円が普通預金に振り込まれた。
    answer: 普通預金 3,000,000 / 資本金 3,000,000
    hint: 普通預金（資産）が増え、資本金（純資産）が増えました。
    explanation: 資産の増加は借方、純資産の増加は貸方です。
  - id: q2
    question: 銀行から 1,000,000 円を借り入れ、普通預金に入金された。
    answer: 普通預金 1,000,000 / 借入金 1,000,000
    explanation: 普通預金（資産）の増加は借方、借入金（負債）の増加は貸方です。
  - id: q3
    question: 事務所の家賃 120,000 円を普通預金から支払った。
    answer: 支払家賃 120,000 / 普通預金 120,000
    explanation: 支払家賃（費用）の発生は借方、普通預金（資産）の減少は貸方です。
  - id: q4
    question: 文房具 3,000 円を現金で買った（すぐに使う）。
    answer: 消耗品費 3,000 / 現金 3,000
    hint: すぐに使ってしまう少額のものは費用です。
    explanation: 消耗品費（費用）の発生は借方、現金（資産）の減少は貸方です。
  - id: q5
    question: 従業員の給料 250,000 円を普通預金から支払った（差し引くものはない）。
    answer: 給料 250,000 / 普通預金 250,000
    explanation: 給料（費用）の発生は借方、普通預金（資産）の減少は貸方です。
  - id: q6
    question: 仲介の手数料 20,000 円を現金で受け取った。
    answer: 現金 20,000 / 受取手数料 20,000
    explanation: 現金（資産）の増加は借方、受取手数料（収益）の発生は貸方です。
  - id: q7
    question: 現金 50,000 円を普通預金に預け入れた。
    answer: 普通預金 50,000 / 現金 50,000
    explanation: 資産どうしの入れかえです。増えた普通預金が借方、減った現金が貸方です。
  - id: q8
    question: 事務所用のパソコン 200,000 円を買い、代金は普通預金から支払った。
    answer: 備品 200,000 / 普通預金 200,000
    hint: 長く使う器具・備品は資産です。
    explanation: 備品（資産）の増加は借方、普通預金（資産）の減少は貸方です。
  - id: q9
    question: 借入金のうち 100,000 円と、利息 2,000 円を普通預金から返済した。
    answer: |
      借入金 100,000 / 普通預金 102,000
      支払利息 2,000 /
    hint: 返したもとの借金（負債の減少）と、利息（費用）の 2 つが借方に来ます。
    explanation: 借入金（負債）の減少と支払利息（費用）の発生が借方、普通預金（資産）の減少が貸方です。
  - id: q10
    question: 電気代 12,000 円が普通預金から引き落とされた。
    answer: 水道光熱費 12,000 / 普通預金 12,000
    explanation: 水道光熱費（費用）の発生は借方、普通預金（資産）の減少は貸方です。
