id: tax-consumption
title: 消費税（税抜経理）
track: tax
order: 1
level: 2
summary: 税抜経理での仕入・売上・決算・納付の仕訳 6 問（税率 10%）
tags: [消費税, 税抜経理]
basis:
  - name: 消費税法
    url: https://www.nta.go.jp/taxes/shiraberu/zeimokubetsu/shohi.htm
asOf: '2026-10-01'
updated: '2026-10-17'
questions:
  - id: q1
    question: 商品 100,000 円（税抜）を仕入れ、消費税 10% とあわせて掛けとした。税抜経理による。
    answer: |
      仕入 100,000 / 買掛金 110,000
      仮払消費税等 10,000 /
    explanation: 支払った消費税は仮払消費税等（資産）にし、仕入は税抜の金額で記録します。
  - id: q2
    question: 商品を 150,000 円（税抜）で売り、消費税 10% とあわせて掛けとした。税抜経理による。
    answer: |
      売掛金 165,000 / 売上 150,000
      / 仮受消費税等 15,000
    explanation: 預かった消費税は仮受消費税等（負債）にし、売上は税抜の金額で記録します。
  - id: q3
    question: 事務用品 5,000 円（税抜）を買い、消費税 10% とあわせて現金で支払った。税抜経理による。
    answer: |
      消耗品費 5,000 / 現金 5,500
      仮払消費税等 500 /
    explanation: 経費の支払いでも、消費税は仮払消費税等にします。
  - id: q4
    question: 決算で、仮受消費税等 15,000 円と仮払消費税等 10,500 円を相殺し、差額を納付することにした。
    answer: |
      仮受消費税等 15,000 / 仮払消費税等 10,500
      / 未払消費税等 4,500
    explanation: 差額 4,500 円は、まだ納めていない消費税なので未払消費税等（負債）です。
  - id: q5
    question: 上の未払消費税等 4,500 円を、普通預金から納付した。
    answer: 未払消費税等 4,500 / 普通預金 4,500
    explanation: 未払消費税等（負債）の減少は借方、普通預金（資産）の減少は貸方です。
  - id: q6
    question: 税込 33,000 円（税率 10%）の備品を買い、代金は翌月払いとした。税抜経理による。
    answer: |
      備品 30,000 / 未払金 33,000
      仮払消費税等 3,000 /
    hint: 税込金額 ÷ 1.1 で税抜の金額がわかります。
    explanation: 33,000 ÷ 1.1 ＝ 30,000 円が税抜の金額、差額 3,000 円が消費税です。
