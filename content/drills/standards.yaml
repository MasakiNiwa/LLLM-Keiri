questions:
  - id: q1
    question: 商品を 20,000 円で現金で売り、200 ポイント（1 ポイント 1 円、すべて使われると見込む）を付与した。取引価格の配分は、商品 19,802 円・ポイント 198 円とする。
    answer: |
      現金 20,000 / 売上 19,802
      / 契約負債 198
    explanation: ポイントに配分した分は、まだ果たしていない履行義務なので契約負債にします。
  - id: q2
    question: 上のポイントのうち 99 円分が使われた（商品の引渡しとあわせて、契約負債を売上に振り替える）。
    answer: 契約負債 99 / 売上 99
    explanation: ポイントが使われて履行義務を果たした分だけ、契約負債を売上に振り替えます。
  - id: q3
    question: 商品 200,000 円を掛けで売った。過去の実績から、3% は返品されると見込む。
    answer: |
      売掛金 200,000 / 売上 194,000
      / 返金負債 6,000
    explanation: 返品の見込み分（200,000 × 3% ＝ 6,000 円）は売上にせず、返金負債にします。
  - id: q4
    question: 注文を受け、商品を渡す前に代金 30,000 円が普通預金に振り込まれた（収益認識基準による）。
    answer: 普通預金 30,000 / 契約負債 30,000
    explanation: 渡す前に受け取った対価は契約負債です（前受金と同じ考え方）。
  - id: q5
    question: 決算で、帳簿の数量 50 個・実地の数量 48 個・取得原価 @1,000 円・正味売却価額 @900 円の商品について、棚卸減耗損と商品評価損を計上する。
    answer: |
      棚卸減耗損 2,000 / 繰越商品 6,800
      商品評価損 4,800 /
    explanation: 棚卸減耗損は 2 個 × @1,000 ＝ 2,000 円、商品評価損は 48 個 × @100 ＝ 4,800 円です。
  - id: q6
    question: 店舗の建物（帳簿価額 3,000,000 円）に減損の兆候がある。割引前将来キャッシュ・フローは 2,500,000 円、正味売却価額は 1,600,000 円、使用価値は 1,800,000 円。減損損失を計上する（直接減らす）。
    answer: 減損損失 1,200,000 / 建物 1,200,000
    hint: 回収可能価額は、正味売却価額と使用価値の高いほうです。
    explanation: 割引前将来キャッシュ・フロー（2,500,000）＜ 帳簿価額なので認識。回収可能価額 1,800,000 円まで減らし、差額 1,200,000 円が減損損失です。
  - id: q7
    question: 新しいリース会計基準により、リースの開始日に、支払うリース料の現在価値 457,971 円で使用権資産とリース負債を計上した。
    answer: 使用権資産 457,971 / リース負債 457,971
    explanation: 借り手は、リース料の現在価値で使用権資産とリース負債を計上します。
  - id: q8
    question: 1 年目の末にリース料 100,000 円を普通預金から支払った。そのうち利息は 13,739 円である。
    answer: |
      リース負債 86,261 / 普通預金 100,000
      支払利息 13,739 /
    explanation: リース料を利息と元本に分け、元本の分だけリース負債を減らします。
  - id: q9
    question: 決算で、翌期に支給する賞与のうち当期分 500,000 円を見積もり、賞与引当金を計上した。
    answer: 賞与引当金繰入 500,000 / 賞与引当金 500,000
    explanation: 当期に働いた分の賞与を見積もって費用にし、賞与引当金（負債）を計上します。
  - id: q10
    question: 従業員が退職し、退職金 2,000,000 円を普通預金から支払った。退職給付引当金が十分にある（源泉所得税などは省略）。
    answer: 退職給付引当金 2,000,000 / 普通預金 2,000,000
    explanation: 引当金を計上していた分は、支払時に退職給付引当金を取り崩します。
