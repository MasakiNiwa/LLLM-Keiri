id: standards-drill
title: 会計基準の仕訳（収益認識・在庫・減損・リース・引当金）
track: standards
order: 1
level: 4
summary: ポイントと返品の見込み、棚卸減耗損と商品評価損、減損損失、新しいリース会計基準、賞与引当金・退職給付引当金の 10 問
tags: [収益認識, 契約負債, 返金負債, 棚卸資産, 減損, 使用権資産, 引当金]
