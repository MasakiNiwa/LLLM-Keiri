id: closing-adjustments
title: 決算整理仕訳
track: closing
order: 1
level: 2
summary: 売上原価・減価償却・貸倒引当金・経過勘定・現金過不足・消費税など、決算整理の仕訳 10 問（決算日は 3 月 31 日）
tags: [決算整理, 売上原価, 減価償却, 貸倒引当金, 経過勘定]
basis:
  - name: 企業会計原則
asOf: '2026-10-01'
updated: '2026-10-17'
questions:
  - id: q1
    question: 期首商品棚卸高 45,000 円を、繰越商品勘定から仕入勘定に振り替える（三分法）。
    answer: 仕入 45,000 / 繰越商品 45,000
    hint: しーくり
    explanation: 期首の在庫は当期に売れたと考え、仕入（売上原価の計算）に加えます。
  - id: q2
    question: 期末商品棚卸高は 52,000 円である。売上原価を仕入勘定で計算する（三分法）。
    answer: 繰越商品 52,000 / 仕入 52,000
    hint: くりしー
    explanation: 売れ残った在庫は来期に売るので、仕入から除いて繰越商品（資産）にします。
  - id: q3
    question: 備品（取得原価 500,000 円・残存価額 0・耐用年数 5 年）の減価償却を、定額法・間接法で行う。期首から使っている。
    answer: 減価償却費 100,000 / 減価償却累計額 100,000
    explanation: 500,000 ÷ 5 ＝ 100,000 円。間接法なので減価償却累計額を使います。
  - id: q4
    question: 10 月 1 日に取得した建物（取得原価 3,000,000 円・残存価額 0・耐用年数 30 年）の減価償却を、定額法・間接法・月割で行う。
    answer: 減価償却費 50,000 / 減価償却累計額 50,000
    hint: 1 年分を出してから、10 月〜3 月の月数を掛けます。
    explanation: 1 年分は 3,000,000 ÷ 30 ＝ 100,000 円。6 か月分なので 50,000 円です。
  - id: q5
    question: 売掛金の期末残高 600,000 円に対して 2% の貸倒引当金を差額補充法で設定する。貸倒引当金の残高は 5,000 円である。
    answer: 貸倒引当金繰入 7,000 / 貸倒引当金 7,000
    explanation: 見積額 12,000 円 − 残高 5,000 円 ＝ 7,000 円を繰り入れます。
  - id: q6
    question: 売掛金の期末残高 400,000 円に対して 2% の貸倒引当金を差額補充法で設定する。貸倒引当金の残高は 10,000 円である。
    answer: 貸倒引当金 2,000 / 貸倒引当金戻入 2,000
    hint: 見積額より残高のほうが多いときは？
    explanation: 見積額は 8,000 円。残高 10,000 円のうち多い 2,000 円を取り崩して収益にします。
  - id: q7
    question: 11 月 1 日に 1 年分の保険料 60,000 円を支払い、保険料勘定で処理している。来期分を繰り延べる。
    answer: 前払費用 35,000 / 保険料 35,000
    hint: 来期の分は 4 月〜10 月の何か月分？
    explanation: 4〜10 月の 7 か月分 60,000 × 7/12 ＝ 35,000 円を前払費用にします。
  - id: q8
    question: 借入金の利息のうち、当期分 4,000 円がまだ支払われていない。
    answer: 支払利息 4,000 / 未払費用 4,000
    explanation: 当期の費用で未払いのものは、未払費用（負債）で計上します。
  - id: q9
    question: 現金過不足勘定の借方残高 700 円について、決算日になっても原因がわからなかった。
    answer: 雑損 700 / 現金過不足 700
    explanation: 借方残高（現金の不足）で原因がわからなければ雑損にします。
  - id: q10
    question: 仮受消費税等 80,000 円と仮払消費税等 55,000 円を相殺し、差額を納付することにした。
    answer: |
      仮受消費税等 80,000 / 仮払消費税等 55,000
      / 未払消費税等 25,000
    explanation: 差額 25,000 円はまだ納めていない消費税なので、未払消費税等（負債）です。
