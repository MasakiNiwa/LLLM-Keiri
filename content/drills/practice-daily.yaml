id: practice-daily
title: 経理の実務（経費精算・入金・給与・月次）
track: practice
order: 1
level: 2
summary: 仮払金の精算、振込手数料の差し引き、給料の預り金と納付、社会保険料、月次の見越し計上など 10 問
tags: [経費精算, 仮払金, 入金消込, 預り金, 法定福利費, 月次決算]
basis:
  - name: 企業会計原則
  - name: 所得税法（給与所得の源泉徴収）
asOf: '2026-10-01'
updated: '2026-10-18'
questions:
  - id: q1
    question: 出張の前に、旅費の概算 40,000 円を現金で渡した。
    answer: 仮払金 40,000 / 現金 40,000
    hint: 使いみちと金額がまだ決まっていません。
    explanation: 精算するまでは、仮払金（資産）にしておきます。
  - id: q2
    question: 出張から戻った従業員から、旅費交通費 37,000 円の精算を受け、残りの現金 3,000 円を受け取った。仮払金は 40,000 円である。
    answer: |
      旅費交通費 37,000 / 仮払金 40,000
      現金 3,000 /
    explanation: 仮払金をすべて取り崩し、使った分を旅費交通費、戻ってきた分を現金にします。
  - id: q3
    question: 従業員が会社の文房具 2,500 円を立て替えて購入した。月末にまとめて普通預金から振り込む。
    answer: 消耗品費 2,500 / 未払金 2,500
    explanation: 会社の費用（消耗品費）で、従業員に後で払う義務は未払金です。
  - id: q4
    question: 得意先 C 社への売掛金 330,000 円について、振込手数料 440 円を差し引いた額が普通預金に入金された。手数料は当社負担の取り決めである。
    answer: |
      普通預金 329,560 / 売掛金 330,000
      支払手数料 440 /
    explanation: 売掛金は請求額をすべて消し込み、差し引かれた手数料は支払手数料にします。
  - id: q5
    question: 得意先から、来月渡す商品の代金 80,000 円が先に普通預金に振り込まれた。
    answer: 普通預金 80,000 / 前受金 80,000
    explanation: 商品を渡す前に受け取った代金は、前受金（負債）にします。
  - id: q6
    question: 給料 280,000 円から、源泉所得税 6,000 円・住民税 10,000 円・社会保険料 42,000 円を差し引き、残りを普通預金から振り込んだ。
    answer: |
      給料 280,000 / 所得税預り金 6,000
      / 預り金 10,000
      / 社会保険料預り金 42,000
      / 普通預金 222,000
    hint: 給料は差し引く前の総額で費用にします。
    explanation: 差し引いた源泉所得税・住民税・社会保険料は、納めるまで預り金（負債）。手取りの 222,000 円を振り込みます。
  - id: q7
    question: 先月の給料から差し引いた源泉所得税 6,000 円と住民税 10,000 円を、普通預金から納付した。
    answer: |
      所得税預り金 6,000 / 普通預金 16,000
      預り金 10,000 /
    explanation: 預かっていたお金を納めるので、預り金を減らします。費用にはなりません。
  - id: q8
    question: 社会保険料を普通預金から納付した。従業員から預かった分 42,000 円と、会社の負担分 42,000 円の合計 84,000 円である（会社の負担分は見越し計上していない）。
    answer: |
      社会保険料預り金 42,000 / 普通預金 84,000
      法定福利費 42,000 /
    explanation: 従業員の負担分は預り金を減らし、会社の負担分は法定福利費（費用）にします。
  - id: q9
    question: 月次決算で、当月分の会社負担の社会保険料 42,000 円を見越し計上した（納付は翌月末）。
    answer: 法定福利費 42,000 / 未払費用 42,000
    explanation: 当月の費用だがまだ払っていないので、未払費用（負債）とともに計上します。
  - id: q10
    question: 月次決算で、内容がわからないまま仮受金にしていた入金 25,000 円が、D 社の売掛金の入金とわかった。
    answer: 仮受金 25,000 / 売掛金 25,000
    explanation: 仮受金を取り崩し、本来の科目（売掛金の減少）に振り替えます。
