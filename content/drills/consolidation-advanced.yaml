id: consolidation-advanced
title: 連結 2 年目・配当・持分法
track: consolidation
order: 3
level: 5
summary: 開始仕訳・子会社の配当・アップストリームの未実現利益・持分法の仕訳 6 問
tags: [連結, 開始仕訳, 配当金, アップストリーム, 持分法]
basis:
  - name: 連結財務諸表に関する会計基準（企業会計基準第 22 号）
  - name: 持分法に関する会計基準（企業会計基準第 16 号）
asOf: '2026-10-01'
updated: '2026-10-18'
questions:
  - id: q1
    question: 前期の連結修正で「のれん償却 20 / のれん 20」をした。当期の開始仕訳として入れ直す。
    answer: 利益剰余金 20 / のれん 20
    explanation: 前期の損益の項目は、開始仕訳では利益剰余金にします。
  - id: q2
    question: 前期の連結修正で「非支配株主に帰属する当期純利益 40 / 非支配株主持分 40」をした。当期の開始仕訳として入れ直す。
    answer: 利益剰余金 40 / 非支配株主持分 40
    explanation: 前期の非支配株主に帰属する当期純利益は、開始仕訳では利益剰余金にします。
  - id: q3
    question: 子会社 S（持分 80%）が配当金 100 を支払い、親会社 P は受取配当金 80 を計上した。連結修正仕訳をする。
    answer: |
      受取配当金 80 / 利益剰余金 100
      非支配株主持分 20 /
    explanation: 親会社への 80 は消去、非支配株主への 20 は非支配株主持分を減らし、子会社で減らした利益剰余金 100 を戻します。
  - id: q4
    question: 親会社 P の期末の在庫のうち 200 は子会社 S（持分 70%・売上総利益率 30%）から仕入れたもの。未実現利益を消去し、非支配株主にも負担させる。
    answer: |
      売上原価 60 / 繰越商品 60
      非支配株主持分 18 / 非支配株主に帰属する当期純利益 18
    hint: 未実現利益は 200 × 30%、そのうち非支配株主の分は 30% です。
    explanation: 未実現利益 60 を消去し、アップストリームなので 60 × 30% ＝ 18 を非支配株主の負担にします。
  - id: q5
    question: 関連会社 A（持分 30%）の当期純利益は 500 だった。持分法で取り込む。
    answer: 関連会社株式 150 / 持分法による投資損益 150
    explanation: 500 × 30% ＝ 150。
  - id: q6
    question: 関連会社 A から配当金 45 を受け取り、受取配当金にしている。持分法の修正をする。
    answer: 受取配当金 45 / 関連会社株式 45
    explanation: 持分法では、関連会社からの配当は投資の払い戻しなので、関連会社株式を減らします。
