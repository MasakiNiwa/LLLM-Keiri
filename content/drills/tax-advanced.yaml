questions:
  - id: q1
    question: 決算で、仮受消費税等 240,000 円と仮払消費税等 170,000 円を精算した（一般課税）。
    answer: |
      仮受消費税等 240,000 / 仮払消費税等 170,000
      / 未払消費税等 70,000
    explanation: 差額 70,000 円が納める消費税です。申告・納付まで未払消費税等にします。
  - id: q2
    question: 決算で、仮受消費税等 30,000 円と仮払消費税等 45,000 円を精算した（一般課税）。差額は還付される。
    answer: |
      仮受消費税等 30,000 / 仮払消費税等 45,000
      未収入金 15,000 /
    hint: 払った消費税のほうが多いときは、戻ってきます。
    explanation: 還付される 15,000 円は、受け取る権利なので未収入金（資産）にします。
  - id: q3
    question: 簡易課税（第 5 種・みなし仕入率 50%）の会社が、決算で仮受消費税等 100,000 円と仮払消費税等 30,000 円を精算した。納付額は 100,000 × (1 − 50%) ＝ 50,000 円で、差額は雑益とする。
    answer: |
      仮受消費税等 100,000 / 仮払消費税等 30,000
      / 未払消費税等 50,000
      / 雑益 20,000
    explanation: 簡易課税の納付額は仮受と仮払の差（70,000 円）と一致しません。その差 20,000 円を雑益にします。
  - id: q4
    question: 税理士（個人）への報酬 200,000 円（税抜）と消費税 20,000 円から、源泉所得税 20,420 円を差し引き、普通預金から振り込んだ。費用は支払手数料とする（税抜経理）。
    answer: |
      支払手数料 200,000 / 所得税預り金 20,420
      仮払消費税等 20,000 / 普通預金 199,580
    explanation: 200,000 × 10.21% ＝ 20,420 円を差し引き、220,000 − 20,420 ＝ 199,580 円を振り込みます。
  - id: q5
    question: 上の源泉所得税 20,420 円を、翌月 10 日に普通預金から納付した。
    answer: 所得税預り金 20,420 / 普通預金 20,420
    explanation: 預かっていた税を納めるので、所得税預り金を減らします。
  - id: q6
    question: 法人税等の中間申告で、300,000 円を普通預金から納付した。
    answer: 仮払法人税等 300,000 / 普通預金 300,000
    explanation: 当期の税額が決まるまでの前払いなので、仮払法人税等（資産）にします。
  - id: q7
    question: 決算で、当期の法人税等が 720,000 円と計算された。中間申告で 300,000 円を納めている。
    answer: |
      法人税等 720,000 / 仮払法人税等 300,000
      / 未払法人税等 420,000
    explanation: 前払いの 300,000 円を差し引いた 420,000 円を、確定申告で納めるまで未払法人税等にします。
  - id: q8
    question: 損金にならなかった貸倒引当金の繰入 50,000 円について、法定実効税率 30% で税効果会計を適用する。
    answer: 繰延税金資産 15,000 / 法人税等調整額 15,000
    explanation: 将来、損金になって税金が 50,000 × 30% ＝ 15,000 円減る見込みを、繰延税金資産として計上します。
