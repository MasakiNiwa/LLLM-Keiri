id: us-subsidiary-80
title: 米国子会社（持分 80%・ドル建て）の連結
summary: P 社が米国に設立した S 社（持分 80%）を、ドルの試算表から円に換算して連結します。決算日・期中平均・取得時の 3 つのレートと、為替換算調整勘定の動き、キャッシュ・フロー計算書の換算差額、地域別のセグメント情報を確かめます
level: 5
unit: 千円
lessons:
  - consolidation-foreign-translation
  - consolidation-capital
  - consolidation-after-acquisition
  - consolidation-cash-flow
  - consolidation-segments
basis:
  - name: 外貨建取引等会計処理基準 三 在外子会社等の財務諸表項目の換算
  - name: 連結財務諸表に関する会計基準（企業会計基準第 22 号）
asOf: '2026-10-01'
updated: '2026-10-18'
entities:
  - id: p
    name: P 社（親会社）
    role: parent
    segment: 日本
    note: 期首（2025 年 4 月 1 日）に、米国の S 社を現地の会社と共同で設立し、資本金 1,000 千ドルのうち 800 千ドル（80%）を出資した（1 ドル 150 円 → 120,000 千円）。期中に 40,000 千円を借り入れた
    trialBalance: |
      普通預金 80,000 / 買掛金 60,000
      売掛金 80,000 / 借入金 70,000
      子会社株式 120,000 / 資本金 200,000
      建物 100,000 / 利益剰余金 30,000
      売上原価 210,000 / 売上 300,000
      給料 50,000 /
      支払家賃 20,000 /
  - id: s
    name: S 社（米国子会社）
    role: subsidiary
    ownership: 80
    segment: 北米
    currency: USD
    unit: 千ドル
    rates:
      HR: 150
      AR: 145
      CR: 140
    note: 期首に設立（資本金 1,000 千ドル。払込み時のレート 1 ドル 150 円）。期中に 1 ドル 150 円から 140 円へ円高が進んだ（期中平均 145 円）
    opening:
      balanceSheet: ''
    trialBalance: |
      普通預金 400 / 買掛金 200
      売掛金 300 / 資本金 1,000
      繰越商品 200 / 売上 1,200
      備品 400 /
      売上原価 800 /
      給料 200 /
      支払家賃 100 /
opening:
  note: 期首は S 社の設立前なので、P 社だけの貸借対照表
  balanceSheet: |
    普通預金 150,000 / 買掛金 50,000
    売掛金 60,000 / 借入金 30,000
    建物 100,000 / 資本金 200,000
    / 利益剰余金 30,000
eliminations:
  - id: capital
    category: capital
    title: 投資と資本の相殺消去
    question: S 社の資本金 1,000 千ドルは、設立時（取得時）のレート 1 ドル 150 円で換算すると 150,000 千円。P 社の子会社株式は 120,000 千円（80%）。投資と資本を相殺消去する。
    shiwake: |
      資本金 150,000 / 子会社株式 120,000
      / 非支配株主持分 30,000
    explanation: 資本は取得時のレート（HR 150 円）で換算するので、資本金は 150,000 千円。そのうち 80% の 120,000 千円が P 社の子会社株式と相殺され、20% の 30,000 千円が非支配株主持分になります。設立時の出資なので、のれんは生じません。
  - id: nci-profit
    category: nci
    title: 子会社の当期純利益の非支配株主への配分
    question: S 社の当期純利益は 100 千ドル。損益は期中平均レート（1 ドル 145 円）で換算するので 14,500 千円。非支配株主の持分（20%）を振り替える。
    shiwake: 非支配株主に帰属する当期純利益 2,900 / 非支配株主持分 2,900
    explanation: 円に換算した当期純利益 14,500 千円 × 20% ＝ 2,900 千円が非支配株主の分です。
  - id: translation
    category: translation
    title: 為替換算調整勘定の非支配株主への配分
    question: S 社の換算で生じた為替換算調整勘定は 10,500 千円の借方残高（円高による減少）。このうち非支配株主の持分（20%）を振り替える。
    shiwake: 非支配株主持分 2,100 / 為替換算調整勘定 2,100
    explanation: 為替換算調整勘定も子会社の純資産の一部なので、20%（2,100 千円）は非支配株主の負担です。借方残高（マイナス）のうち 2,100 を非支配株主持分から差し引き、連結の為替換算調整勘定には親会社の分（8,400 千円の借方）だけが残ります。結果、非支配株主持分は 30,800 千円＝ S 社の純資産 1,100 千ドル × 決算日レート 140 円 × 20% と一致します。
