id: segments-domestic
title: 事業の種類別のセグメント情報（製造と小売）
summary: 小売事業の P 社と、製造事業の子会社 S 社（持分 100%）を連結し、セグメント情報（売上高・セグメント利益・セグメント資産）を作ります。セグメント間の売上高と、連結との差（調整額）がどの修正仕訳から来るかをたどります
level: 4
unit: 千円
lessons:
  - consolidation-segments
  - consolidation-capital
basis:
  - name: セグメント情報等の開示に関する会計基準（企業会計基準第 17 号）
  - name: 連結財務諸表に関する会計基準（企業会計基準第 22 号）
asOf: '2026-10-01'
updated: '2026-10-18'
entities:
  - id: p
    name: P 社（親会社）
    role: parent
    segment: 小売事業
    note: 店舗で商品を販売する。商品の一部（当期 60,000 千円）は S 社から仕入れている。期末の商品のうち 12,000 千円は S 社から仕入れたもの。期末に S 社への買掛金が 8,000 千円ある
    trialBalance: |
      普通預金 40,000 / 買掛金 25,000
      売掛金 30,000 / 借入金 35,000
      繰越商品 20,000 / 資本金 100,000
      建物 60,000 / 利益剰余金 30,000
      子会社株式 50,000 / 売上 200,000
      売上原価 150,000 /
      給料 30,000 /
      支払家賃 10,000 /
  - id: s
    name: S 社（製造子会社）
    role: subsidiary
    ownership: 100
    segment: 製造事業
    note: P 社が全額出資して設立した（資本金 50,000 千円。設立時の利益剰余金はない）。製品を P 社とグループ外の会社に販売する。P 社への売上高は 60,000 千円で、利益率は 25%
    trialBalance: |
      普通預金 20,000 / 買掛金 8,000
      売掛金 18,000 / 資本金 50,000
      繰越商品 10,000 / 利益剰余金 10,000
      備品 40,000 / 売上 110,000
      売上原価 70,000 /
      給料 15,000 /
      減価償却費 5,000 /
eliminations:
  - id: capital
    category: capital
    title: 投資と資本の相殺消去
    question: P 社は S 社を設立時に全額出資（50,000 千円）した。S 社の資本金は 50,000 千円。投資と資本を相殺消去する。
    shiwake: 資本金 50,000 / 子会社株式 50,000
    explanation: 設立時の出資なので、子会社株式と資本金が同じ金額で消えます。のれんも非支配株主持分も生じません。設立後に S 社が稼いだ利益剰余金は、すべて親会社の分なのでそのまま残ります。
  - id: sales
    category: intercompany
    title: P 社と S 社の売買の消去
    question: S 社は P 社に製品を 60,000 千円で販売した（P 社では仕入れ）。グループ内の売上と仕入（売上原価）を消去する。
    shiwake: 売上 60,000 / 売上原価 60,000
    between: [s, p]
    explanation: グループの中で品物が動いただけなので、連結では売上も仕入もなかったことにします。セグメント情報では、製造事業の「セグメント間の内部売上高」60,000 千円にあたり、調整額で消去されます。
  - id: balances
    category: balances
    title: 売掛金と買掛金の相殺消去
    question: 期末に、S 社は P 社への売掛金 8,000 千円、P 社は S 社への買掛金 8,000 千円がある。
    shiwake: 買掛金 8,000 / 売掛金 8,000
    between: [s, p]
    explanation: グループの中の貸し借りは、連結では債権でも債務でもないので相殺します。セグメント資産では、製造事業の売掛金に含まれていた分が調整額で消えます。
  - id: unrealized
    category: unrealized
    title: 期末の商品に含まれる未実現利益の消去
    question: P 社の期末の商品のうち 12,000 千円は S 社から仕入れたもの。S 社の利益率は 25%。未実現利益を消去する（S 社は全額出資なので、非支配株主への配分はない）。
    shiwake: 売上原価 3,000 / 繰越商品 3,000
    between: [s, p]
    explanation: 12,000 × 25% ＝ 3,000 千円は、グループの外にまだ売れていない分の利益です。連結の利益と商品から差し引きます。セグメント利益では、製造事業の利益に含まれたまま、調整額でまとめて差し引かれます。
