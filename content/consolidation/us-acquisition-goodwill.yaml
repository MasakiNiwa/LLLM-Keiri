id: us-acquisition-goodwill
title: 米国企業の買収（のれんの換算）
summary: P 社が米国の A 社を 100% 買収して 1 年。ドル建てののれんを、償却は期中平均レート、残高は決算日レートで換算し、差額を為替換算調整勘定にします
level: 5
unit: 千円
lessons:
  - consolidation-foreign-translation
  - consolidation-capital
basis:
  - name: 外貨建取引等会計処理基準 三 在外子会社等の財務諸表項目の換算
  - name: 外貨建取引等の会計処理に関する実務指針（会計制度委員会報告第 4 号）
  - name: 連結財務諸表に関する会計基準（企業会計基準第 22 号）
asOf: '2026-10-01'
updated: '2026-10-19'
entities:
  - id: p
    name: P 社（親会社）
    role: parent
    note: 前期末（2025 年 3 月 31 日、1 ドル 150 円）に、米国の A 社の株式 100% を 1,200 千ドル（180,000 千円）で取得した
    trialBalance: |
      普通預金 70,000 / 買掛金 60,000
      売掛金 80,000 / 借入金 120,000
      子会社株式 180,000 / 資本金 200,000
      建物 100,000 / 利益剰余金 30,000
      売上原価 210,000 / 売上 300,000
      給料 50,000 /
      支払家賃 20,000 /
  - id: a
    name: A 社（米国子会社）
    role: subsidiary
    ownership: 100
    currency: USD
    unit: 千ドル
    rates:
      HR: 150
      AR: 145
      CR: 140
    note: 取得日の資本は 資本金 800・利益剰余金 200（合計 1,000 千ドル。時価と帳簿価額は同じ）。当期は 1 ドル 150 円から 140 円へ円高が進んだ（期中平均 145 円）
    trialBalance: |
      普通預金 500 / 買掛金 200
      売掛金 300 / 資本金 800
      繰越商品 200 / 利益剰余金 200
      備品 300 / 売上 1,000
      売上原価 700 /
      給料 150 /
      支払家賃 50 /
eliminations:
  - id: capital
    category: capital
    title: 投資と資本の相殺消去（のれんはドルで）
    question: P 社は A 社株式の 100% を 1,200 千ドル（取得時 1 ドル 150 円 → 180,000 千円）で取得した。取得日の A 社の資本は 資本金 800・利益剰余金 200 千ドル。取得時のレートで投資と資本を相殺消去する。
    shiwake: |
      資本金 120,000 / 子会社株式 180,000
      利益剰余金 30,000 /
      のれん 30,000 /
    explanation: 資本は取得時のレート 150 円で換算します（資本金 800 × 150 ＝ 120,000、利益剰余金 200 × 150 ＝ 30,000）。のれんは 1,200 − 1,000 ＝ 200 千ドルで、在外子会社ののれんは子会社の通貨（ドル）で計上します。取得時は 200 × 150 ＝ 30,000 千円です。
  - id: goodwill
    category: goodwill
    title: のれんの償却（期中平均レート）
    question: のれん 200 千ドルを 10 年で定額法により償却する。償却額（費用）は期中平均レート 1 ドル 145 円で換算する。
    shiwake: のれん償却 2,900 / のれん 2,900
    explanation: 1 年分は 200 ÷ 10 ＝ 20 千ドル。費用なので期中平均レートで換算し、20 × 145 ＝ 2,900 千円です。
  - id: goodwill-translation
    category: translation
    title: のれんの換算替え（決算日レート）
    question: 期末ののれんの残高 180 千ドル（200 − 20）を、決算日レート 1 ドル 140 円で換算し直す。差額は為替換算調整勘定にする。
    shiwake: 為替換算調整勘定 1,900 / のれん 1,900
    explanation: 決算日レートでの残高は 180 × 140 ＝ 25,200 千円。いまの帳簿の金額は 30,000 − 2,900 ＝ 27,100 千円なので、1,900 千円減らします。円高でのれんの円の価値が減った分は、損益ではなく為替換算調整勘定（純資産）にします。
