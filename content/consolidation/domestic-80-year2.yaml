id: domestic-80-year2
title: 国内子会社（持分 80%）の連結 2 年目
summary: 取得から 2 年目。前期までの修正を開始仕訳として入れ直し、子会社の配当金・子会社から親会社への販売（アップストリーム）の未実現利益・前期の未実現利益の実現も修正します
level: 5
unit: 千円
lessons:
  - consolidation-second-year
  - consolidation-dividends
  - consolidation-intercompany
basis:
  - name: 連結財務諸表に関する会計基準（企業会計基準第 22 号）
  - name: 資本連結実務指針（会計制度委員会報告第 7 号）
asOf: '2026-10-01'
updated: '2026-10-18'
entities:
  - id: p
    name: P 社（親会社）
    role: parent
    note: 前々期末に S 社株式の 80% を 1,000 で取得。当期に S 社から配当金 40 を受け取った。期末の在庫のうち 60 は S 社から仕入れた商品。買掛金のうち 100 は S 社に対するもの
    trialBalance: |
      普通預金 1,700 / 買掛金 800
      売掛金 1,000 / 借入金 1,200
      繰越商品 700 / 資本金 3,000
      子会社株式 1,000 / 利益剰余金 1,010
      建物 1,900 / 売上 5,500
      売上原価 4,200 / 受取配当金 40
      給料 650 /
      支払家賃 400 /
  - id: s
    name: S 社（子会社）
    role: subsidiary
    ownership: 80
    note: 取得日の資本は 資本金 800・利益剰余金 200。前期の当期純利益は 100（期首の利益剰余金 300）。当期に配当金 50 を支払い（利益剰余金は 250 に）、当期純利益は 150。当期に P 社へ商品を 300 販売した（売上総利益率 25%）
    trialBalance: |
      普通預金 500 / 買掛金 600
      売掛金 600 / 借入金 150
      繰越商品 400 / 資本金 800
      備品 450 / 利益剰余金 250
      売上原価 1,950 / 売上 2,500
      給料 300 /
      支払家賃 100 /
eliminations:
  - id: opening
    category: capital
    title: 開始仕訳（前期までの修正の引き継ぎ）
    question: 前期までの連結修正（取得時の投資と資本の相殺消去：資本金 800・利益剰余金 200・子会社株式 1,000・非支配株主持分 200・のれん 200、前期ののれん償却 10、前期の S 社の当期純利益 100 のうち非支配株主の分 20）を、開始仕訳として入れ直す。前期の損益の項目は利益剰余金にする。
    shiwake: |
      資本金 800 / 子会社株式 1,000
      利益剰余金 230 / 非支配株主持分 220
      のれん 190 /
    explanation: 連結修正仕訳は個別の帳簿に残らないので、毎期入れ直します。前期の「のれん償却 10」と「非支配株主に帰属する当期純利益 20」は、前期の利益を通じて利益剰余金を減らしているので、開始仕訳では利益剰余金（200 ＋ 10 ＋ 20 ＝ 230）にまとめます。のれんは 200 − 10 ＝ 190、非支配株主持分は 200 ＋ 20 ＝ 220 です。
  - id: goodwill
    category: goodwill
    title: 当期ののれんの償却
    question: のれん（取得時 200、20 年で定額法）の当期分を償却する。
    shiwake: のれん償却 10 / のれん 10
    explanation: 200 ÷ 20 ＝ 10。
  - id: nci-profit
    category: nci
    title: 子会社の当期純利益の非支配株主への配分
    question: S 社の当期純利益は 150 である。非支配株主の持分（20%）を振り替える。
    shiwake: 非支配株主に帰属する当期純利益 30 / 非支配株主持分 30
    explanation: 150 × 20% ＝ 30。
  - id: dividend
    category: dividend
    title: 子会社の配当金の修正
    question: S 社は当期に配当金 50 を支払った（利益剰余金を 50 減らした）。P 社は 40 を受取配当金にしている。非支配株主への 10 も含めて修正する。
    shiwake: |
      受取配当金 40 / 利益剰余金 50
      非支配株主持分 10 /
    explanation: P 社への 40 はグループ内のお金の移動なので、受取配当金を消し、S 社で減らした利益剰余金を戻します。非支配株主への 10 は、グループの外への支払いなので、非支配株主持分を減らします。
  - id: sales
    category: intercompany
    title: 内部取引（S 社から P 社への販売）の消去
    question: 当期に S 社は P 社に商品を 300 販売した。内部取引を消去する。
    shiwake: 売上 300 / 売上原価 300
    explanation: グループ内の売上と仕入（売上原価）を両方消します。
  - id: balances
    category: balances
    title: 債権債務の相殺消去
    question: P 社の買掛金のうち 100 は S 社に対するもの（S 社の売掛金）である。相殺消去する。
    shiwake: 買掛金 100 / 売掛金 100
    explanation: グループ内の貸し借りを相殺します。
  - id: upstream
    category: unrealized
    title: 期末の在庫の未実現利益（アップストリーム）
    question: P 社の期末の在庫のうち 60 は S 社から仕入れた商品である（S 社の売上総利益率 25%）。未実現利益を消去し、非支配株主の持分（20%）にも負担させる。
    shiwake: |
      売上原価 15 / 繰越商品 15
      非支配株主持分 3 / 非支配株主に帰属する当期純利益 3
    explanation: 60 × 25% ＝ 15 を消去します。売り手は子会社（アップストリーム）なので、消去した利益のうち 20%（3）は非支配株主の負担として、非支配株主持分と非支配株主に帰属する当期純利益を減らします。
  - id: realized
    category: unrealized
    title: 前期末の未実現利益の実現
    question: 前期末に S 社の在庫に含まれていた未実現利益 10（P 社からの販売・ダウンストリーム）は、当期にグループの外へ売れて実現した。開始仕訳とあわせて修正する。
    shiwake: 利益剰余金 10 / 売上原価 10
    explanation: 前期に消去した利益 10 は、開始仕訳では利益剰余金を減らし（期首の在庫を減らす）、当期に売れたので売上原価を減らして利益を戻します。2 つをまとめると「利益剰余金 10 / 売上原価 10」です。
