# 用語集。レッスンの太字（**用語**）がここの用語・別名と一致すると、押して説明を開ける
# related には用語か勘定科目の名前、lessons にはレッスンの id を書く
- term: 仕訳
  kana: しわけ
  description: 取引を、借方（左）と貸方（右）に分けて、勘定科目と金額で記録すること。借方の合計と貸方の合計は必ず一致する。
  lessons: [basics-journal-rules]
  related: [転記, 試算表]
- term: 転記
  kana: てんき
  description: 仕訳を、勘定科目ごとの帳簿（総勘定元帳）に書き写すこと。科目ごとの残高がわかるようになる。
  lessons: [basics-ledger-posting]
  related: [仕訳, 総勘定元帳]
- term: 総勘定元帳
  kana: そうかんじょうもとちょう
  aliases: [元帳]
  description: 勘定科目ごとに、増減と残高を記録する帳簿。T 字の形で表すこともある（T 字勘定）。
  lessons: [basics-ledger-posting]
  related: [転記]
- term: 試算表
  kana: しさんひょう
  aliases: [残高試算表]
  description: 総勘定元帳の勘定科目ごとの残高を一覧にした表。借方の合計と貸方の合計が一致するかで、転記の誤りを見つける。
  lessons: [basics-trial-balance]
  related: [精算表, 総勘定元帳]
- term: 精算表
  kana: せいさんひょう
  description: 試算表に決算整理の修正を加えて、損益計算書と貸借対照表を作るまでを 1 枚にまとめた表。連結では、各社の金額と連結修正仕訳から連結の金額を出す表（連結精算表）を使う。
  lessons: [closing-overview]
  related: [試算表, 決算整理]
- term: 決算整理
  kana: けっさんせいり
  aliases: [決算整理仕訳]
  description: 決算で、期中の記録を正しい期間の損益と期末の財産の状態に合わせるための修正。売上原価の計算・減価償却・貸倒引当金・経過勘定など。
  lessons: [closing-overview]
  related: [精算表, 経過勘定]
- term: 経過勘定
  kana: けいかかんじょう
  description: 前払費用・前受収益・未払費用・未収収益のように、お金のやりとりと費用・収益の期間がずれるときに使う勘定。
  lessons: [closing-accruals]
  related: [前払費用, 未払費用, 前受収益, 未収収益]
- term: 貸借対照表
  kana: たいしゃくたいしょうひょう
  aliases: [B/S, BS, バランスシート]
  description: 決算日の資産・負債・純資産の状態（財政状態）を表す表。資産 ＝ 負債 ＋ 純資産。
  lessons: [basics-bs-pl]
  related: [損益計算書]
- term: 損益計算書
  kana: そんえきけいさんしょ
  aliases: [P/L, PL]
  description: 1 年間などの期間の収益と費用、その差の利益（経営成績）を表す表。売上総利益・営業利益・経常利益・当期純利益の段階がある。
  lessons: [basics-bs-pl]
  related: [貸借対照表, 営業利益, 経常利益]
- term: 営業利益
  kana: えいぎょうりえき
  description: 売上総利益から販売費及び一般管理費を引いた、本業のもうけ。
  lessons: [analysis-ratios]
  related: [経常利益, 損益計算書]
- term: 経常利益
  kana: けいじょうりえき
  description: 営業利益に、受取利息などの営業外収益を足し、支払利息などの営業外費用を引いた、ふだんの活動のもうけ。
  lessons: [analysis-ratios]
  related: [営業利益, 損益計算書]
- term: キャッシュ・フロー計算書
  kana: きゃっしゅふろーけいさんしょ
  aliases: [CF 計算書, キャッシュフロー計算書]
  description: 期間中のお金（現金及び現金同等物）の増減を、営業・投資・財務の活動に分けて表す表。
  lessons: [consolidation-cash-flow]
  related: [間接法]
- term: 間接法
  kana: かんせつほう
  description: キャッシュ・フロー計算書の営業活動の部分を、利益から始めて、お金の動かない費用や売上債権・在庫などの増減を調整して作る方法。
  lessons: [consolidation-cash-flow]
  related: [キャッシュ・フロー計算書]
- term: 発生主義
  kana: はっせいしゅぎ
  description: お金のやりとりのときではなく、取引や価値の増減が起きたときに費用・収益を記録する考え方。今の会計の基本。
  lessons: [closing-accruals]
  related: [経過勘定]
- term: 帳簿価額
  kana: ちょうぼかがく
  aliases: [簿価]
  description: 帳簿に載っている金額。固定資産では、取得原価から減価償却累計額（と減損損失）を引いた額。
  lessons: [closing-asset-disposal]
  related: [減価償却累計額, 取得原価]
- term: 取得原価
  kana: しゅとくげんか
  description: 資産を手に入れるのにかかった額。購入代価に、引取運賃・手数料・据付費などの付随費用を含める。
  lessons: [closing-depreciation, trade-securities]
  related: [帳簿価額]
- term: 定額法
  kana: ていがくほう
  description: 減価償却の方法の 1 つ。毎年同じ額（取得原価 ÷ 耐用年数など）を減価償却費にする。
  lessons: [closing-depreciation]
  related: [減価償却費, 耐用年数]
- term: 耐用年数
  kana: たいようねんすう
  description: 固定資産を使える年数。減価償却費の計算に使う。税法では資産の種類ごとに決められている（法定耐用年数）。
  lessons: [closing-depreciation]
  related: [定額法, 減価償却費]
- term: 実地棚卸
  kana: じっちたなおろし
  description: 期末に、倉庫や店の在庫を実際に数えること。帳簿の数量との差は棚卸減耗損になる。
  lessons: [standards-inventory-valuation, closing-cost-of-sales]
  related: [棚卸減耗損, 商品評価損]
- term: 正味売却価額
  kana: しょうみばいきゃくかがく
  description: 売れる見込みの額（売価・時価）から、売るためにかかる費用を引いた額。棚卸資産の評価や減損の測定に使う。
  lessons: [standards-inventory-valuation, standards-impairment]
  related: [商品評価損, 回収可能価額]
- term: 回収可能価額
  kana: かいしゅうかのうかがく
  description: 減損の測定で使う額。正味売却価額と使用価値の高いほう。
  lessons: [standards-impairment]
  related: [正味売却価額, 使用価値, 減損損失]
- term: 使用価値
  kana: しようかち
  description: 資産を使い続けたときに生まれる将来キャッシュ・フローの現在価値。
  lessons: [standards-impairment]
  related: [回収可能価額, 現在価値]
- term: 現在価値
  kana: げんざいかち
  description: 将来受け取る（支払う）お金を、利率（割引率）で割り引いて、今の価値に直した額。1 年後の 103 円は、割引率 3% なら今の 100 円。
  lessons: [standards-new-lease, standards-impairment]
  related: [使用価値, リース負債]
- term: 履行義務
  kana: りこうぎむ
  description: 収益認識基準で、顧客との契約の中の、別々の商品・サービスを渡す約束。履行義務を果たしたときに収益を認識する。
  lessons: [standards-revenue-recognition]
  related: [独立販売価格, 契約負債]
- term: 独立販売価格
  kana: どくりつはんばいかかく
  description: 商品・サービスを別々に売るとしたときの価格。取引価格を履行義務に配分するときの比に使う。
  lessons: [standards-revenue-recognition]
  related: [履行義務]
- term: 変動対価
  kana: へんどうたいか
  description: 値引き・リベート・返品などで、受け取る額が変わりうる対価。見込みを反映して取引価格を決める。
  lessons: [standards-revenue-recognition]
  related: [返金負債]
- term: 引当金
  kana: ひきあてきん
  description: 将来の特定の費用・損失のうち、当期以前の出来事が原因で、発生の可能性が高く、金額を合理的に見積もれるものを、当期の費用として計上したときの貸方の科目。
  lessons: [standards-provisions, closing-bad-debts]
  related: [貸倒引当金, 賞与引当金, 退職給付引当金]
- term: 支配
  kana: しはい
  description: 連結で、ほかの会社の意思決定機関（株主総会・取締役会など）を支配していること。ふつう議決権の過半数を持つと支配しているとされ、その会社は子会社になる。
  lessons: [consolidation-overview]
  related: [連結財務諸表, 非支配株主]
- term: 連結財務諸表
  kana: れんけつざいむしょひょう
  aliases: [連結決算]
  description: 親会社と子会社を 1 つの会社とみなして作る財務諸表。グループ内の取引や貸し借りは消去する。
  lessons: [consolidation-overview]
  related: [支配, 精算表]
- term: 非支配株主
  kana: ひしはいかぶぬし
  description: 子会社の株主のうち、親会社以外の株主。その持分は連結貸借対照表で非支配株主持分になる。
  lessons: [consolidation-capital]
  related: [非支配株主持分, 非支配株主に帰属する当期純利益]
- term: 未実現利益
  kana: みじつげんりえき
  description: グループ内で売買した商品などが、まだグループの外に売れずに残っているとき、その中に含まれる売り手の利益。連結では消去する。
  lessons: [consolidation-intercompany]
  related: [連結財務諸表]
- term: 持分法
  kana: もちぶんほう
  description: 関連会社などへの投資について、その会社の純資産と損益のうち持分の分を、投資の額に反映させる方法。合算はしない。
  lessons: [consolidation-equity-method]
  related: [持分法による投資損益, 関連会社株式]
- term: 決算日レート
  kana: けっさんびれーと
  aliases: [CR]
  description: 決算日の為替相場。在外子会社の資産・負債の換算に使う。
  lessons: [consolidation-foreign-translation]
  related: [期中平均レート, 取得時レート, 為替換算調整勘定]
- term: 期中平均レート
  kana: きちゅうへいきんれーと
  aliases: [AR]
  description: 期間中の平均の為替相場。在外子会社の収益・費用の換算に使う（決算日レートも使える）。
  lessons: [consolidation-foreign-translation]
  related: [決算日レート, 取得時レート]
- term: 取得時レート
  kana: しゅとくじれーと
  aliases: [HR]
  description: 子会社の株式を取得したときの為替相場。在外子会社の資本（取得時の資本金など）の換算に使う。
  lessons: [consolidation-foreign-translation]
  related: [決算日レート, 期中平均レート]
- term: セグメント情報
  kana: せぐめんとじょうほう
  description: 連結グループを事業や地域の区分（セグメント）に分けて、売上高・利益・資産などを示す情報。経営者が意思決定に使う区分による（マネジメント・アプローチ）。
  lessons: [consolidation-segments]
  related: [マネジメント・アプローチ]
- term: マネジメント・アプローチ
  kana: まねじめんとあぷろーち
  description: セグメントの分け方や利益の測り方を、経営者が内部で意思決定・業績評価に使っているものに合わせる考え方。
  lessons: [consolidation-segments]
  related: [セグメント情報]
- term: 仕入税額控除
  kana: しいれぜいがくこうじょ
  description: 消費税の計算で、売上で預かった消費税から、仕入や経費で払った消費税を差し引くこと。原則としてインボイスと帳簿の保存が必要。
  lessons: [tax-consumption-tax-basics, tax-invoice]
  related: [適格請求書, 仮払消費税等]
- term: 適格請求書
  kana: てきかくせいきゅうしょ
  aliases: [インボイス]
  description: 登録番号・税率ごとの金額と消費税額などを書いた請求書。税務署に登録した適格請求書発行事業者だけが発行できる。
  lessons: [tax-invoice]
  related: [仕入税額控除]
- term: 簡易課税制度
  kana: かんいかぜいせいど
  aliases: [簡易課税]
  description: 基準期間の課税売上高が 5,000 万円以下の事業者が届け出て選べる、消費税の計算方法。預かった消費税にみなし仕入率をかけて控除する額を出す。
  lessons: [tax-settlement-simplified]
  related: [みなし仕入率, 仕入税額控除]
- term: みなし仕入率
  kana: みなししいれりつ
  description: 簡易課税制度で、業種ごとに決められた、控除する消費税の割合（第 1 種 90% 〜 第 6 種 40%）。
  lessons: [tax-settlement-simplified]
  related: [簡易課税制度]
- term: 源泉徴収
  kana: げんせんちょうしゅう
  description: 給料や一定の報酬を払う会社が、所得税などを差し引いて預かり、本人に代わって国に納めるしくみ。
  lessons: [practice-payroll, tax-withholding]
  related: [所得税預り金]
- term: 課税所得
  kana: かぜいしょとく
  description: 法人税を計算するもとになる所得。会計の利益に、税法の決まり（損金にならない交際費など）による調整を加えて計算する。
  lessons: [tax-corporate-tax, tax-tax-effect]
  related: [法人税等, 一時差異]
- term: 一時差異
  kana: いちじさい
  description: 会計と税務の資産・負債の金額のずれのうち、将来解消するもの。税効果会計の対象になる。
  lessons: [tax-tax-effect]
  related: [繰延税金資産, 課税所得]
- term: 月次決算
  kana: げつじけっさん
  description: 毎月帳簿を締めて、月ごとの試算表や損益を出すこと。経営者が早く業績をつかむために行う。
  lessons: [practice-monthly-closing]
  related: [試算表]
- term: 入金消込
  kana: にゅうきんけしこみ
  aliases: [消込]
  description: 入金があったとき、どの得意先の、どの請求の分かを突き合わせて、売掛金を消すこと。
  lessons: [practice-billing-collection]
  related: [売掛金]
- term: 電子取引
  kana: でんしとりひき
  description: 請求書・領収書などを、メールやウェブ・EDI などのデータでやりとりする取引。そのデータは、データのまま保存する必要がある（電子帳簿保存法）。
  lessons: [tax-electronic-books]
  related: [適格請求書]
- term: ROE
  kana: あーるおーいー
  aliases: [自己資本利益率]
  description: 当期純利益 ÷ 自己資本。株主の出したお金に対して、どれだけ利益を上げたかを表す。
  lessons: [analysis-ratios, finance-roe-dupont]
  related: [自己資本比率, デュポン分解]
- term: 流動比率
  kana: りゅうどうひりつ
  description: 流動資産 ÷ 流動負債。1 年以内に払う負債に対して、1 年以内にお金になる資産がどれだけあるか。
  lessons: [analysis-ratios]
  related: [自己資本比率]
- term: 自己資本比率
  kana: じこしほんひりつ
  description: 自己資本 ÷ 総資産。資産のうち、返す必要のない自己資本でまかなっている割合。
  lessons: [analysis-ratios]
  related: [ROE, 流動比率]
- term: IFRS
  kana: いふぁーす
  aliases: [国際財務報告基準]
  description: 国際会計基準審議会（IASB）が作る国際的な会計基準。日本でも一定の会社が連結財務諸表に任意で適用できる。
  lessons: [standards-ifrs]
  related: [連結財務諸表]
- term: 原価計算
  kana: げんかけいさん
  description: 製品やサービスを作るのにかかった原価を計算すること。売値の決定・原価の管理・財務諸表の作成に使う。
  lessons: [cost-basics]
  related: [仕掛品, 製造間接費]
- term: 予定配賦
  kana: よていはいふ
  aliases: [予定配賦率]
  description: 製造間接費を、年の初めに決めた予定配賦率（予算 ÷ 基準操業度）× 実際操業度で製品に配賦すること。実際発生額との差は配賦差異になる。
  lessons: [cost-overhead]
  related: [製造間接費, 原価差異]
- term: 加工進捗度
  kana: かこうしんちょくど
  description: 総合原価計算で、仕掛品の加工がどこまで進んでいるかの割合。仕掛品の数量 × 加工進捗度 ＝ 完成品換算量。
  lessons: [cost-process]
  related: [完成品換算量]
- term: 完成品換算量
  kana: かんせいひんかんさんりょう
  description: 仕掛品を、完成品に直すと何個分かで表した量。加工費を完成品と月末仕掛品に分けるときに使う。
  lessons: [cost-process]
  related: [加工進捗度]
- term: 標準原価
  kana: ひょうじゅんげんか
  description: 製品 1 個を作るのにかかるはずの原価を、調査にもとづいて決めたもの。実際の原価と比べて、差異の原因を分析する。
  lessons: [cost-standard]
  related: [原価差異]
- term: 限界利益
  kana: げんかいりえき
  description: 売上高から変動費を引いた利益。固定費をまかない、残りが営業利益になる。
  lessons: [cost-cvp, finance-segment-pl]
  related: [損益分岐点, 貢献利益]
- term: 損益分岐点
  kana: そんえきぶんきてん
  aliases: [損益分岐点売上高]
  description: 利益がちょうど 0 になる売上高（や販売数量）。固定費 ÷ 限界利益率で求める。
  lessons: [cost-cvp]
  related: [限界利益]
- term: 内部統制
  kana: ないぶとうせい
  description: 業務の有効性及び効率性・報告の信頼性・法令等の遵守・資産の保全の 4 つの目的を達成するために、社内に組み込まれ、組織のすべての人が行うしくみ（6 つの基本的要素からなる）。
  lessons: [jsox-framework]
  related: [統制環境, 内部統制報告制度]
- term: 内部統制報告制度
  kana: ないぶとうせいほうこくせいど
  aliases: [J-SOX]
  description: 上場会社の経営者が、財務報告に係る内部統制の有効性を評価して内部統制報告書を出し、監査人の監査を受ける制度（金融商品取引法）。
  lessons: [jsox-overview]
  related: [内部統制, 開示すべき重要な不備]
- term: 統制環境
  kana: とうせいかんきょう
  description: 内部統制の 6 つの基本的要素の 1 つ。経営者の誠実性・倫理観、取締役会や監査役の監視、組織構造など、組織の気風。ほかの要素の土台になる。
  lessons: [jsox-framework]
  related: [内部統制]
- term: RCM
  kana: あーるしーえむ
  aliases: [リスク・コントロール・マトリクス]
  description: 業務プロセスのリスクと、それに対応するコントロール（統制）、守る要件（アサーション）、統制の種類を一覧にした表。業務記述書・フローチャートとあわせて「3 点セット」と呼ばれる。
  lessons: [jsox-rcm, jsox-scope-process]
  related: [アサーション, キーコントロール]
- term: アサーション
  kana: あさーしょん
  aliases: [適正な財務報告を確保するための要件]
  description: 財務報告が正しいための要件。実在性・網羅性・権利と義務の帰属・評価の妥当性・期間配分の適切性・表示の妥当性。
  lessons: [jsox-rcm]
  related: [RCM]
- term: キーコントロール
  kana: きーこんとろーる
  description: リスクを十分に下げる中心のコントロール。内部統制の評価で重点的に確かめる。
  lessons: [jsox-rcm]
  related: [RCM]
- term: 職務の分離
  kana: しょくむのぶんり
  aliases: [職務分掌]
  description: 取引の承認・記録・資産の管理などを別々の人が行うこと。1 人で完結できないようにして、誤りや不正を防ぐ。
  lessons: [jsox-accounting-role]
  related: [内部統制]
- term: IT 全般統制
  kana: あいてぃーぜんぱんとうせい
  description: システムが正しく動き続けるための管理（開発・変更管理、運用、アクセス管理、外部委託先の管理）。自動化された統制が有効であるための前提。
  lessons: [jsox-it]
  related: [IT 業務処理統制]
- term: IT 業務処理統制
  kana: あいてぃーぎょうむしょりとうせい
  description: 業務の処理の中に組み込まれた統制（入力チェック、自動計算、マスタとの照合など）。
  lessons: [jsox-it]
  related: [IT 全般統制]
- term: 開示すべき重要な不備
  kana: かいじすべきじゅうようなふび
  description: 内部統制の不備のうち、財務報告に重要な影響を及ぼす可能性が高いもの。期末日にあると、内部統制は有効でないと報告する。金額的重要性の目安の例は、連結税引前利益の概ね 5% 程度。
  lessons: [jsox-deficiency]
  related: [内部統制報告制度]
- term: 益金
  kana: えききん
  description: 法人税の所得の計算での収益にあたるもの。会計の収益とほぼ同じだが、受取配当等の一部など、益金にならないもの（益金不算入）がある。
  lessons: [tax-corporate-income]
  related: [損金, 申告調整]
- term: 損金
  kana: そんきん
  description: 法人税の所得の計算での費用・損失にあたるもの。会計の費用とほぼ同じだが、法人税等・交際費の一部・償却超過額など、損金にならないもの（損金不算入）がある。
  lessons: [tax-corporate-income]
  related: [益金, 損金経理]
- term: 申告調整
  kana: しんこくちょうせい
  description: 会計の当期利益から、税法の所得を出すための加算・減算。別表四で行う。
  lessons: [tax-corporate-income, tax-beppyo4-5]
  related: [別表四]
- term: 損金経理
  kana: そんきんけいり
  description: 決算で費用・損失として計上すること。減価償却費や引当金の繰入などは、損金経理をしていないと損金にできない（確定決算主義）。
  lessons: [tax-corporate-income]
  related: [損金]
- term: 別表四
  kana: べっぴょうよん
  description: 法人税の申告書のうち、所得の金額を計算する明細書。当期利益に加算・減算をして所得金額を出し、各項目を留保と社外流出に分ける。
  lessons: [tax-beppyo4-5]
  related: [留保, 社外流出, 利益積立金額]
- term: 留保
  kana: りゅうほ
  description: 別表四の区分の 1 つ。会社の中に残る調整（納税充当金・償却超過額など）。別表五(一)の利益積立金額に引き継ぐ。
  lessons: [tax-beppyo4-5]
  related: [社外流出, 別表四]
- term: 社外流出
  kana: しゃがいりゅうしゅつ
  description: 別表四の区分の 1 つ。配当・交際費の損金不算入額など、会社の外に出たもの。
  lessons: [tax-beppyo4-5]
  related: [留保, 別表四]
- term: 利益積立金額
  kana: りえきつみたてきんがく
  description: 税務上の利益の蓄積（別表五(一)）。会計の利益剰余金に、別表四で留保した調整の累計を加えたもの。
  lessons: [tax-beppyo4-5]
  related: [留保]
- term: 納税充当金
  kana: のうぜいじゅうとうきん
  description: 決算で計上した未払法人税等（法人税・住民税・事業税の見積額）の税務上の呼び方。損金にならないので、別表四で加算・留保する。
  lessons: [tax-beppyo4-5]
  related: [未払法人税等, 別表四]
- term: 年末調整
  kana: ねんまつちょうせい
  description: 会社が、1 年間に給与から源泉徴収した所得税と、本当の年税額との過不足を、年末に精算する手続き。
  lessons: [practice-year-end-1, practice-year-end-2]
  related: [給与所得控除, 源泉徴収票]
- term: 給与所得控除
  kana: きゅうよしょとくこうじょ
  description: 給与の収入金額から差し引く、会社員の必要経費にあたる控除。2025 年分からは最低 65 万円。
  lessons: [practice-year-end-2]
  related: [年末調整]
- term: 源泉徴収票
  kana: げんせんちょうしゅうひょう
  description: 1 年間の給与の額・源泉徴収税額・控除の内容を書いた書類。翌年 1 月 31 日までに本人に渡し、一定の範囲は税務署にも出す。
  lessons: [practice-statutory-reports]
  related: [法定調書, 年末調整]
- term: 法定調書
  kana: ほうていちょうしょ
  description: 給与・報酬・不動産の使用料などの支払いを税務署に報告する書類（源泉徴収票・支払調書など）と、その合計表。翌年 1 月 31 日までに出す。
  lessons: [practice-statutory-reports]
  related: [源泉徴収票]
- term: 給与支払報告書
  kana: きゅうよしはらいほうこくしょ
  description: 1 年間の給与の支払いを、従業員の 1 月 1 日の住所の市区町村に報告する書類。翌年度の住民税の計算に使われる。
  lessons: [practice-statutory-reports]
  related: [源泉徴収票]
- term: 標準報酬月額
  kana: ひょうじゅんほうしゅうげつがく
  description: 健康保険・厚生年金の保険料を計算するもとになる、報酬の月額を等級に当てはめた額。毎年 4〜6 月の報酬で決め直す（算定基礎届）。
  lessons: [practice-payroll-deductions]
  related: [社会保険料預り金, 法定福利費]
- term: 割増賃金
  kana: わりましちんぎん
  description: 時間外・深夜・休日の労働に対して払う、通常の賃金に一定の率を上乗せした賃金（時間外 25% 以上、月 60 時間超 50% 以上など）。
  lessons: [practice-payroll-gross]
  related: [給料]
- term: 償却資産
  kana: しょうきゃくしさん
  description: 固定資産税の対象になる、事業に使う備品・機械・構築物などの資産。1 月 1 日に持っているものを 1 月 31 日までに市区町村に申告する。
  lessons: [practice-depreciable-assets-return]
  related: [租税公課]
- term: 資金繰り表
  kana: しきんぐりひょう
  description: 月ごと（または週ごと）のお金の出入りを、経常収支・経常外収支・財務収支に分けて、予定と実績で管理する表。残高が不足する時期を早めに見つける。
  lessons: [finance-cash-plan]
  related: [黒字倒産, 運転資金]
- term: 黒字倒産
  kana: くろじとうさん
  description: 損益は黒字なのに、支払いのお金が足りなくなって倒産すること。売掛金・在庫の増加や回収の遅れなどで起きる。
  lessons: [finance-cash-vs-profit]
  related: [資金繰り表, 運転資金]
- term: 運転資金
  kana: うんてんしきん
  aliases: [必要運転資金]
  description: 事業を回すために立て替えておく必要があるお金。売上債権 ＋ 棚卸資産 − 仕入債務。売上が伸びると増える。
  lessons: [finance-working-capital]
  related: [CCC, 黒字倒産]
- term: CCC
  kana: しーしーしー
  aliases: [キャッシュ・コンバージョン・サイクル]
  description: 仕入れの支払いから売上の回収まで、お金が寝ている日数。売上債権回転日数 ＋ 棚卸資産回転日数 − 仕入債務回転日数。
  lessons: [finance-working-capital]
  related: [運転資金]
- term: 予実差異
  kana: よじつさい
  aliases: [予算実績差異, 予実分析]
  description: 実績と予算の差。売上高・利益は実績が上回れば有利差異、費用は上回れば不利差異。売上高は価格差異と数量差異に分けて原因を探る。
  lessons: [finance-budget-variance]
  related: [着地見込み]
- term: 着地見込み
  kana: ちゃくちみこみ
  aliases: [着地予想, フォーキャスト]
  description: 期首からの実績に残りの月の見込みを足した、年度末の見込みの数字。予算との差を早めにつかみ、手を打つために使う。
  lessons: [finance-budget-variance]
  related: [予実差異]
- term: デュポン分解
  kana: でゅぽんぶんかい
  aliases: [デュポン・システム]
  description: ROE を、売上高純利益率 × 総資産回転率 × 財務レバレッジ に分けて、どの要素が ROE を動かしているかを見る方法。
  lessons: [finance-roe-dupont]
  related: [ROE]
- term: フリー・キャッシュ・フロー
  kana: ふりーきゃっしゅふろー
  aliases: [FCF]
  description: 営業キャッシュ・フローから事業を続けるための投資を引いた、自由に使えるお金。簡便には営業 CF ＋ 投資 CF。
  lessons: [finance-free-cash-flow]
  related: [キャッシュ・フロー計算書]
- term: EBITDA
  kana: いーびっとだー
  description: 営業利益に減価償却費を足した、本業の稼ぐ力の目安（簡便な計算）。有利子負債 ÷ EBITDA で返済能力を見ることもある。
  lessons: [finance-free-cash-flow]
  related: [フリー・キャッシュ・フロー]
- term: 貢献利益
  kana: こうけんりえき
  description: 限界利益から、その部門・製品だけにかかる固定費を引いた利益。部門をやめるかどうかの判断や、部門長の評価に使う。
  lessons: [finance-segment-pl]
  related: [限界利益]
- term: ハルシネーション
  kana: はるしねーしょん
  description: 生成 AI が、もっともらしいが事実と違う内容（存在しない条文・誤った数字など）を出力すること。根拠を一次情報で確かめて防ぐ。
  lessons: [ai-generative, ai-risk-control]
  related: [生成 AI]
- term: 生成 AI
  kana: せいせいえーあい
  aliases: [LLM, 大規模言語モデル]
  description: 文章などを作り出す AI。経理では下書き・要約・論点の整理・表計算の式づくりに向く。計算や最新の制度の判断はプログラムと一次情報で確かめる。
  lessons: [ai-generative, ai-local-llm]
  related: [ハルシネーション, RAG]
- term: RAG
  kana: らぐ
  aliases: [検索拡張生成]
  description: 社内規程などの資料を検索し、その内容をもとに生成 AI が答える仕組み。資料の更新と、答えに出典を付けることが大切。
  lessons: [ai-generative]
  related: [生成 AI]
- term: AI-OCR
  kana: えーあいおーしーあーる
  description: 紙や PDF の請求書・領収書から、日付・金額・登録番号などを AI で読み取る技術。読み取りの誤りがあるので、検算と元の証憑の保存が必要。
  lessons: [ai-ocr-journal]
  related: [デジタルインボイス]
- term: AI エージェント
  kana: えーあいえーじぇんと
  description: 目標を受けて手順を考え、システムの操作や検索などの道具を使って仕事を進める AI。経理では権限の最小化・人の承認・記録を設計して使う。
  lessons: [ai-agents]
  related: [生成 AI]
- term: デジタルインボイス
  kana: でじたるいんぼいす
  aliases: [Peppol, JP PINT, 電子インボイス]
  description: 請求書を、システムが読める決まった形のデータでやり取りする仕組み。日本ではデジタル庁が Peppol に基づく標準の仕様（JP PINT）を管理している。
  lessons: [ai-digital-invoice]
  related: [AI-OCR]
