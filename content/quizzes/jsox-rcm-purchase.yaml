id: jsox-rcm-purchase
title: 業務記述書から RCM を作る（購買プロセス）
track: internal-control
order: 3
level: 4
summary: 購買プロセスの業務記述書を読み、6 つのリスクについてコントロールの手順・アサーション・予防か発見か・手作業か自動かを選んで RCM を完成させ、キーコントロールと評価の確認問題 4 問を解きます
tags:
  [
    RCM,
    業務記述書,
    購買プロセス,
    アサーション,
    予防的統制,
    発見的統制,
    IT 業務処理統制,
    キーコントロール,
  ]
basis:
  - name: 財務報告に係る内部統制の評価及び監査に関する実施基準（企業会計審議会、2023 年 4 月改訂）
asOf: '2026-10-01'
updated: '2026-10-18'
rcm:
  process: 購買プロセス（発注から支払いまで）
  steps:
    - id: s1
      text: 購買担当者は、部門長が承認した購入申請書にもとづいて、購買管理システムに発注を入力する。購買課長が申請書と発注の内容を照らし合わせてシステム上で承認し、承認されるまで発注書は出力されない。
    - id: s2
      text: 仕入先マスタへの新規登録・口座などの変更は、経理担当者が仕入先からの書面にもとづいて申請し、経理課長が書面と登録内容を照らし合わせて承認してから反映される。
    - id: s3
      text: 商品が届くと、倉庫担当者は納品書と現物の数量を数えて確かめ、購買管理システムに検収を入力する。検収を入力した日に、仕入と買掛金が計上される。
    - id: s4
      text: 仕入先の請求書を受け取ると、システムが発注・検収のデータと単価・数量・金額を自動で照合する（3 点照合）。一致しないものは支払予定に載らず、差異リストに出力される。
    - id: s5
      text: 経理担当者は、支払予定表から振込データを作成する。経理課長が請求書と支払予定表を照らし合わせて承認し、承認されたデータだけがネットバンキングで送金される（作成者と承認者は別の人）。
    - id: s6
      text: 毎月末、経理担当者は主要な仕入先から届く残高の明細と買掛金の残高を照合し、差異があれば原因を調べて記録する。経理課長はその結果をレビューしてサインする。
    - id: s7
      text: 期末日の前後 5 営業日に検収した取引について、経理担当者は納品書の日付・検収日・計上日を照合し、計上した期間が正しいかを確かめる。経理課長がその結果をレビューする。
  risks:
    - id: r1
      risk: 必要のない・承認されていない発注が行われ、架空の仕入や不正な支払いにつながる
      control: s1
      assertion: 実在性
      type: 予防
      method: IT 依存の手作業
      explanation: 購買課長の承認は人が行う手作業のコントロールですが、「承認されるまで発注書が出ない」というシステムの機能に支えられているので、IT 依存の手作業と整理します。発生していない取引を防ぐので実在性（発生）です。
    - id: r2
      risk: 実在しない仕入先が登録されたり、仕入先の口座が不正に変更されたりして、代金が別の口座に支払われる
      control: s2
      assertion: 実在性
      type: 予防
      method: 手作業
      explanation: マスタの登録・変更を、書面と照らし合わせて承認してから反映するので、誤りや不正を事前に防ぐ予防的な手作業のコントロールです。不正な支払い（実在しない債務への支払い）を防ぐので実在性です。
    - id: r3
      risk: 請求書の単価・数量が発注や検収と違うまま計上・支払いされ、仕入や買掛金の金額を誤る
      control: s4
      assertion: 評価の妥当性
      type: 予防
      method: 自動
      explanation: システムが自動で照合し、一致しないものは支払予定に載らないので、自動の予防的なコントロール（IT 業務処理統制）です。金額の正しさなので評価の妥当性と整理します。自動のコントロールは、IT 全般統制が有効なら、運用評価のサンプルを少なくできます。
    - id: r4
      risk: 誤った金額や、承認されていない相手に送金される
      control: s5
      assertion: 実在性
      type: 予防
      method: 手作業
      explanation: 作成者と別の人が、証憑と照らし合わせて承認してから送金するので、予防的な手作業のコントロールです（職務分掌）。実在する債務に対する正しい支払いかを確かめるので実在性と整理します。
    - id: r5
      risk: 検収の入力漏れや請求の取り違えで、買掛金が計上漏れになる
      control: s6
      assertion: 網羅性
      type: 発見
      method: 手作業
      explanation: 月末に外部の残高明細と照合して、すでに起きた誤りを見つけるので、発見的な手作業のコントロールです。負債の計上漏れを見つけるので網羅性です。
    - id: r6
      risk: 期末日の前後の仕入が、誤った期に計上される
      control: s7
      assertion: 期間配分の適切性
      type: 発見
      method: 手作業
      explanation: 計上した後で日付を照合して誤りを見つけるので、発見的な手作業のコントロールです。正しい期に計上されているか（カットオフ）なので期間配分の適切性です。
questions:
  - id: q1
    context: 手順 3（倉庫担当者が数量を確かめて検収を入力し、その日に仕入と買掛金が計上される）について考えます。
    question: 手順 3 は、上の RCM ではどのリスクにも対応づけていません。その理由として最も適切なものは？
    choices:
      - 取引を記録する業務の手順そのもので、ほかの人が確かめるしくみ（承認・照合）が書かれていないから
      - 倉庫の仕事は内部統制の対象外だから
      - 自動のコントロールだから
    answer: 0
    explanation: 業務の手順と、リスクを下げるコントロールは別のものです。検収の入力ミスは、手順 4 の 3 点照合や手順 6 の残高照合で防ぐ・見つける設計になっています。
  - id: q2
    question: 買掛金の「網羅性」のリスクに対するキーコントロールとして、最もふさわしいのは？
    choices: [手順 1 の発注の承認, 手順 6 の月末の残高照合, 手順 2 の仕入先マスタの承認]
    answer: 1
    explanation: 計上漏れ（網羅性）を直接見つけられるのは、外部の残高明細との照合です。発注の承認やマスタの承認は、主に実在性に対するコントロールです。
  - id: q3
    question: 手順 4 の 3 点照合（自動）の運用状況を評価するとき、一般的な考え方は？
    choices:
      - 手作業と同じく、25 件などのサンプルを毎回たくさん確かめる
      - IT 全般統制が有効であることを前提に、少ない件数（1 件など）で確かめられる
      - 自動なので評価しなくてよい
    answer: 1
    explanation: 自動のコントロールは、プログラムが変わらなければ同じように動くので、IT 全般統制（変更管理など）が有効なら、少ない件数で評価できます。評価が不要になるわけではありません。
  - id: q4
    context: 運用評価で、手順 5 の振込データの承認を確かめたところ、繁忙期の 1 か月間、振込データを作成した経理担当者が自分で承認していたことがわかった。
    question: この発見事項の扱いとして適切なものは？
    choices:
      - 作成者と承認者が同じで職務分掌が守られていないので、運用上の不備として影響を評価する
      - 金額が合っていれば問題ない
      - 繁忙期なのでやむを得ず、記録は不要
    answer: 0
    explanation: コントロールが設計どおりに運用されていなかったので、運用上の不備です。その期間の支払いに誤りや不正が無いかを確かめ、金額的・質的な重要性から、開示すべき重要な不備に当たるかを評価します。
