id: audit-basics
title: 会計監査への対応
track: audit
order: 1
level: 4
summary: 責任の分担、監査意見、四半期・半期の制度、アサーション、監査手続、PBC、残高確認、指摘への対応の 10 問
tags: [会計監査, 監査意見, 期中レビュー, アサーション, 残高確認, PBC, 経営者確認書]
basis:
  - name: 監査基準・金融商品取引法・一般的な監査対応の実務
asOf: '2026-10-01'
updated: '2026-10-18'
questions:
  - id: q1
    question: 財務諸表を作る責任は誰にある？
    choices: [監査人, 経営者（会社）, 監査役]
    answer: 1
    explanation: 財務諸表を作る責任は経営者、意見を述べる責任は監査人にあります（二重責任の原則）。
  - id: q2
    question: 「すべての重要な点で適正」という監査意見は？
    choices: [無限定適正意見, 限定付適正意見, 意見不表明]
    answer: 0
    explanation: 無限定適正意見です。限定付は一部を除いて適正、意見不表明は十分な証拠が得られなかった場合です。
  - id: q3
    question: 2024 年 4 月の改正後、上場会社の第 2 四半期（中間期）に提出するのは？
    choices: [四半期報告書, 半期報告書（監査人の期中レビューあり）, 何も提出しない]
    answer: 1
    explanation: 四半期報告書は廃止され、中間期は半期報告書を提出し、期中レビューを受けます。第 1・第 3 四半期は四半期決算短信です。
  - id: q4
    question: 売掛金で監査人が特に気にする向きは？
    choices: [過大（実在しない売掛金）, 過少（計上漏れ）, どちらも気にしない]
    answer: 0
    explanation: 資産・収益は過大になるリスク（実在性）、負債・費用は過少になるリスク（網羅性）を重く見ることが多いです。
  - id: q5
    question: 未払費用の計上漏れを見つけるのに有効な手続は？
    choices: [現金の実査, 期末日後の支払いの一覧を確かめる, 棚卸の立会]
    answer: 1
    explanation: 期末日後に支払ったもののうち、期末までに発生していたものが計上されているかを確かめます（網羅性）。
  - id: q6
    question: 残高確認状の発送と回収は誰が行う？
    choices: [会社の経理, 監査人が直接, 取引先の判断]
    answer: 1
    explanation: 会社を通さず、監査人が直接送って直接回収することで、証拠としての信頼性を保ちます。会社は送付先の一覧づくりと差異の説明をします。
  - id: q7
    question: 監査で、どの会社にもあるリスクとして必ず行われる手続は？
    choices: [仕訳テスト（経営者による内部統制の無効化への対応）, 棚卸の立会, 弁護士への確認]
    answer: 0
    explanation: 経営者による内部統制の無効化のリスクに対応して、期末の通常と違う仕訳などを抽出して確かめます。
  - id: q8
    question: PBC の資料を渡す前に、まず確かめることは？
    choices: [明細の合計が試算表と一致しているか, ファイルの容量, 監査人の好きな様式か]
    answer: 0
    explanation: 明細と試算表が一致しない資料は差し戻されます。増減の大きい科目には理由も添えます。
  - id: q9
    question: 新しい形の大口契約を結ぶ予定がある。会計処理の相談はいつ？
    choices: [期末監査のとき, 取引の前（または発生した四半期のうち）, 監査人から聞かれたら]
    answer: 1
    explanation: 期末になってから処理が変わると、決算と開示の日程に大きく影響します。会社の考えを文書にして早めに相談します。
  - id: q10
    question: 監査人が見つけた小さな誤りを修正しない場合の扱いは？
    choices:
      - 未修正の虚偽表示として集計され、合計で重要でないかが判断される
      - 記録に残らない
      - 自動的に限定付適正意見になる
    answer: 0
    explanation: 未修正のものは監査人が集計し、経営者確認書に一覧を添付することが多いです。積み重なると重要性を超えるおそれがあります。
