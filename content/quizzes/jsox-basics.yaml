id: jsox-basics
title: 内部統制（J-SOX）のきほん
track: internal-control
order: 1
level: 3
summary: 制度のしくみ、4 つの目的と 6 つの基本的要素、評価の流れ、IT 統制、不備の評価の 10 問
tags: [J-SOX, 内部統制, 基本的要素, 評価, 不備]
basis:
  - name: 財務報告に係る内部統制の評価及び監査の基準並びに実施基準（企業会計審議会、2023 年 4 月改訂）
asOf: '2026-10-01'
updated: '2026-10-18'
questions:
  - id: q1
    question: 内部統制の 4 つの目的に含まれないものは？
    choices: [業務の有効性及び効率性, 報告の信頼性, 売上の最大化, 資産の保全]
    answer: 2
    explanation: 4 つの目的は、業務の有効性及び効率性・報告の信頼性・事業活動に関わる法令等の遵守・資産の保全です。
  - id: q2
    question: 6 つの基本的要素のうち、ほかのすべての要素の土台になるのは？
    choices: [統制環境, 統制活動, 情報と伝達, IT への対応]
    answer: 0
    explanation: 経営者の誠実性・倫理観や組織の気風である統制環境が、ほかの要素の基礎になります。
  - id: q3
    question: 2023 年の改訂で、内部統制の目的の 1 つ「財務報告の信頼性」はどう変わった？
    choices: [削除された, 報告の信頼性に広がった, 開示の適正性に名前が変わった]
    answer: 1
    explanation: 非財務情報も含む考え方で「報告の信頼性」になりました。J-SOX の評価の対象は、引き続き財務報告にかかわる内部統制です。
  - id: q4
    question: 評価の進め方として一般的な順番は？
    choices:
      - 業務プロセス → 全社的な内部統制 → 決算・財務報告プロセス
      - 全社的な内部統制 → 決算・財務報告プロセス → 業務プロセス
      - 決算・財務報告プロセス → 業務プロセス → 全社的な内部統制
    answer: 1
    explanation: 会社全体に効く全社的な内部統制を先に評価し、その結果を踏まえて、決算・財務報告プロセスと業務プロセスを評価します。
  - id: q5
    question: 評価範囲の決め方について、2023 年の改訂で明確になったことは？
    choices:
      - 売上高の 2/3 の拠点だけを必ず評価する
      - 金額の目安だけで機械的に決めず、リスクを踏まえて判断する
      - 毎年すべての拠点を評価する
    answer: 1
    explanation: 金額の目安は例示にすぎず、リスクを踏まえて範囲を判断すること、長く範囲外の拠点なども検討することが明確になりました。
  - id: q6
    question: コントロールが「設計どおりに、期間を通じて実際に動いているか」を確かめる評価は？
    choices: [整備状況の評価, 運用状況の評価, 全社的な内部統制の評価]
    answer: 1
    explanation: 運用状況の評価では、サンプルを選んで証跡を確かめます。設計の妥当性を確かめるのは整備状況の評価です。
  - id: q7
    question: 会計システムで消費税額が自動で計算される機能は、どの統制？
    choices: [IT 全般統制, IT 業務処理統制, 統制環境]
    answer: 1
    explanation: 業務の処理の中に組み込まれた自動の統制は、IT 業務処理統制です。前提として、変更管理などの IT 全般統制が有効であることが必要です。
  - id: q8
    question: 金額的重要性の目安として、実施基準で例として示されているものは？
    choices: [連結売上高の概ね 1%, 連結税引前利益の概ね 5%, 連結総資産の概ね 10%]
    answer: 1
    explanation: 連結税引前利益の概ね 5% 程度とすることが考えられる、とされています。最終的には質的な重要性も含めて総合的に判断します。
  - id: q9
    question: 期中に見つかった運用上の不備について、正しいものは？
    choices:
      - 期中に見つかった時点で、期末の評価は必ず「有効でない」になる
      - 期末日までに是正し、是正後のコントロールが動いていることを確かめれば、期末日には有効と評価できる
      - 不備は報告しなくてよい
    answer: 1
    explanation: 期末日時点の有効性を評価するので、期末日までに是正して運用を確かめれば、有効と評価できます。
  - id: q10
    question: 内部統制の限界として挙げられていないものは？
    choices: [担当者の共謀, 経営者による内部統制の無効化, 監査法人による監査]
    answer: 2
    explanation: 判断の誤り・不注意・共謀・想定外の取引・経営者による無効化などが限界として挙げられます。
