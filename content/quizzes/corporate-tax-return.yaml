id: corporate-tax-return
title: 法人税申告の基本（所得の計算と別表）
track: tax
order: 3
level: 4
summary: 益金・損金、申告調整（加算・減算）、留保と社外流出、別表の役割、税額の端数処理、交際費・減価償却の調整の 10 問
tags: [法人税, 申告調整, 別表四, 別表五(一), 留保, 社外流出, 交際費, 減価償却]
basis:
  - name: 法人税法・租税特別措置法
  - name: 国税庁「法人税申告書・地方法人税申告書の記載の手引」
asOf: '2026-10-01'
updated: '2026-10-18'
questions:
  - id: q1
    question: 法人税がかかる「所得」の計算として正しいものは？
    choices: [収益 − 費用, 益金 − 損金, 売上高 − 売上原価]
    answer: 1
    explanation: 所得は益金から損金を引いたものです。実際には、会計の当期利益に申告調整（加算・減算）をして求めます。
  - id: q2
    question: 会計の当期利益から所得金額を計算する別表は？
    choices: [別表一, 別表四, 別表十六]
    answer: 1
    explanation: 別表四（所得の金額の計算に関する明細書）で、当期利益に加算・減算をして所得金額を出します。
  - id: q3
    question: 決算で計上した「未払法人税等」（納税充当金）の別表四での扱いは？
    choices: [加算・留保, 加算・社外流出, 減算・留保]
    answer: 0
    explanation: 法人税等は損金にならないので加算し、会社の中に負債として残るので留保です。
  - id: q4
    question: 受取配当等の益金不算入額の別表四での扱いは？
    choices: [加算, 減算, 調整しない]
    answer: 1
    explanation: 会計では収益ですが、二重課税を避けるため一部が益金にならないので減算します（社外流出 ※ の欄で扱います）。
  - id: q5
    question: 別表五(一)が表すものは？
    choices: [税務上の利益積立金額と資本金等の額, 交際費の明細, 中間申告の税額]
    answer: 0
    explanation: 会計の利益剰余金に、別表四の留保の調整を積み上げた、税務上の純資産を表します。
  - id: q6
    question: 減価償却費 1,200,000 円を計上したが、税法の償却限度額は 1,000,000 円だった。別表四の調整は？
    choices:
      - 200,000 円を加算・留保
      - 200,000 円を減算・留保
      - 調整しない
    answer: 0
    explanation: 限度額を超えた 200,000 円は損金にならないので加算し、資産の帳簿価額の違いとして残るので留保です。
  - id: q7
    question: 減価償却費や引当金の繰入を損金にするための条件は？
    choices:
      - 決算で費用として計上していること（損金経理）
      - 申告書だけで減算すること
      - 税務署の許可を受けること
    answer: 0
    explanation: 確定決算主義のもと、損金経理をしていないと損金にできません。
  - id: q8
    question: 法人税額の計算で、課税標準と税額の端数処理の組み合わせは？
    choices:
      - 課税標準は 100 円未満、税額は 1 円未満を切り捨て
      - 課税標準は 1,000 円未満、税額は 100 円未満を切り捨て
      - 端数は四捨五入
    answer: 1
    explanation: 課税標準（所得金額）は 1,000 円未満、税額は 100 円未満を切り捨てます。
  - id: q9
    question: 交際費等の損金不算入額は、別表四でどう分類される？
    choices: [留保, 社外流出]
    answer: 1
    explanation: 会社の外に支出したもので、将来解消する差異ではないので社外流出です。
  - id: q10
    question: 前期の事業税を当期に納付した。事業税が損金になるのはいつ？
    choices: [前期（所得が生じた期）, 当期（申告して納付した期）, 損金にならない]
    answer: 1
    explanation: 事業税は、申告書を提出した事業年度（ふつうは納付した期）の損金になります。
