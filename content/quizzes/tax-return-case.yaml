id: tax-return-case
title: 法人税申告書の通し演習（A 社）
track: tax
order: 2.5
level: 5
summary: 中小法人 A 社の決算の数字から、別表十五・別表四・別表一・別表五(一) を順に作る 8 問。レッスン「法人税申告書を通しで作る」と同じ数字です
tags: [法人税申告書, 別表一, 別表四, 別表五(一), 別表十五, 交際費, 軽減税率]
basis:
  - name: 法人税法・租税特別措置法
  - name: 国税庁「法人税申告書・地方法人税申告書の記載の手引」
asOf: '2026-10-01'
updated: '2026-10-18'
questions:
  - id: q1
    context: A 社（資本金 1,000 万円の中小法人）。当期純利益 6,000,000、配当の支払い 1,000,000、損金経理をした法人税（中間）400,000・住民税（中間）50,000・納税充当金 1,750,000、交際費等 9,000,000（うち接待飲食費 4,000,000）、減価償却の償却超過額 300,000、納税充当金から支払った前期分の事業税 250,000、受取配当等の益金不算入額 100,000。
    question: 別表十五で計算する交際費等の損金不算入額は？
    choices: ['7,000,000', '1,000,000', '5,000,000']
    answer: 1
    explanation: 中小法人は、定額控除（年 800 万円まで）と接待飲食費の 50%（200 万円）の有利なほうを選べます。9,000,000 − 8,000,000 ＝ 1,000,000 円です。
  - id: q2
    question: 別表四の加算の合計は？（A 社）
    choices: ['3,500,000', '2,500,000', '3,200,000']
    answer: 0
    explanation: 法人税 400,000 ＋ 住民税 50,000 ＋ 納税充当金 1,750,000 ＋ 交際費 1,000,000 ＋ 減価償却超過額 300,000 ＝ 3,500,000 円です。
  - id: q3
    question: 別表四の減算の合計は？（A 社）
    choices: ['250,000', '350,000', '100,000']
    answer: 1
    explanation: 納税充当金から支出した事業税 250,000 ＋ 受取配当等の益金不算入額 100,000 ＝ 350,000 円です。
  - id: q4
    question: 所得金額は？（A 社）
    choices: ['9,150,000', '9,500,000', '8,150,000']
    answer: 0
    explanation: 6,000,000 ＋ 3,500,000 − 350,000 ＝ 9,150,000 円です。
  - id: q5
    question: 別表四の所得金額のうち「留保」の合計は？（A 社）
    choices: ['7,250,000', '9,150,000', '6,250,000']
    answer: 0
    explanation: 当期利益の留保 5,000,000（配当 1,000,000 は社外流出）＋ 留保の加算 2,500,000 − 留保の減算 250,000 ＝ 7,250,000 円です。社外流出は 1,900,000 円で、合計が所得金額 9,150,000 円になります。
  - id: q6
    question: 別表一の法人税額は？（中小法人の軽減税率 15%、それ以外 23.2%）
    choices: ['2,122,800', '1,466,800', '1,372,500']
    answer: 1
    explanation: 8,000,000 × 15% ＝ 1,200,000 と、1,150,000 × 23.2% ＝ 266,800 の合計 1,466,800 円です。
  - id: q7
    question: 確定申告で納める法人税（差引の納付額）は？
    choices: ['1,466,800', '1,066,800', '1,016,800']
    answer: 1
    explanation: 法人税額 1,466,800 から中間申告で納めた 400,000 を引いた 1,066,800 円です（100 円未満切り捨て）。
  - id: q8
    question: 別表五(一) で、減価償却超過額 300,000 円の期末の残高と、その意味は？
    choices:
      - 300,000 円。税務上の帳簿価額が会計より大きく、翌期以降に認容（減算）されて減っていく
      - 0 円。別表四で加算したので消える
      - 300,000 円。会社の外に流出した金額を表す
    answer: 0
    explanation: 留保の加算は別表五(一) の利益積立金額に引き継がれます。将来、償却不足や売却のときに減算され、残高が減ります。
