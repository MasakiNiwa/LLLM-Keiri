id: tax-local
title: 地方税など（住民税・事業税）
track: tax
order: 2.6
level: 4
summary: 地方法人税、法人住民税の法人税割と均等割、法人事業税の所得割と軽減税率、特別法人事業税、外形標準課税、損金になる時期の 8 問
tags: [地方法人税, 法人住民税, 均等割, 法人税割, 法人事業税, 特別法人事業税, 外形標準課税]
basis:
  - name: 地方法人税法・地方税法（標準税率。2019 年 10 月 1 日以後に開始する事業年度）
asOf: '2026-10-01'
updated: '2026-10-18'
questions:
  - id: q1
    question: 法人住民税の均等割の特徴は？
    choices:
      - 赤字でも、資本金等の額と従業者数の区分に応じた定額がかかる
      - 所得に税率を掛ける
      - 黒字の会社だけにかかる
    answer: 0
    explanation: 均等割は定額なので、所得が無くてもかかります。法人税割は法人税額に税率を掛けます。
  - id: q2
    question: 法人税額 1,466,800 円。地方法人税（10.3%）は？
    choices: ['150,900', '151,080', '150,998']
    answer: 0
    explanation: 法人税額の 1,000 円未満を切り捨てた 1,466,000 × 10.3% ＝ 150,998 円、100 円未満を切り捨てて 150,900 円です。
  - id: q3
    question: 法人住民税の法人税割の課税標準は？
    choices: [所得金額, 法人税額, 売上高]
    answer: 1
    explanation: 法人税割は法人税額に、道府県民税・市町村民税の税率（標準で 1.0%・6.0%）を掛けます。
  - id: q4
    question: 中小法人で所得 9,150,000 円。事業税の所得割（標準税率・軽減税率あり）は？
    choices: ['640,500', '432,500', '320,250']
    answer: 1
    explanation: 400 万円 × 3.5% ＋ 400 万円 × 5.3% ＋ 115 万円 × 7.0% ＝ 140,000 ＋ 212,000 ＋ 80,500 ＝ 432,500 円です。
  - id: q5
    question: 特別法人事業税（外形標準課税の対象でない普通法人）の計算は？
    choices: [所得 × 37%, 基準法人所得割額 × 37%, 法人税額 × 37%]
    answer: 1
    explanation: 標準税率で計算した事業税の所得割額（基準法人所得割額）に 37% を掛けます。都道府県が事業税と一緒に徴収します。
  - id: q6
    question: 当期分の事業税（翌期 5 月に確定申告・納付）が法人税の損金になるのは？
    choices: [当期, 申告・納付した翌期, 損金にならない]
    answer: 1
    explanation: 事業税は、申告・納付した期の損金です。そのため翌期の別表四で「納税充当金から支出した事業税等」として減算します。
  - id: q7
    question: 外形標準課税の対象の法人の事業税の特徴は？
    choices:
      - 所得割のほか、付加価値割と資本割がかかるので、赤字でも事業税がかかる
      - 事業税がかからない
      - 所得割の税率が中小法人より高い
    answer: 0
    explanation: 付加価値（給与・支払利息・家賃などと利益）と資本金等にもかかるため、赤字でも負担があります。
  - id: q8
    question: 実際の住民税・事業税の税率を確かめるときに注意することは？
    choices:
      - 自治体の条例で標準税率より高い税率（超過課税）がある
      - 全国どこでも同じ税率
      - 国税庁の税率表だけを見ればよい
    answer: 0
    explanation: 地方税は自治体ごとに条例で税率を決めます。事務所がある都道府県・市町村の税率表を確かめます。
