id: audit-pbc-practice
title: 監査対応の演習（資料の準備と質問への回答）
track: audit
order: 2
level: 4
summary: 監査人の 9 つの依頼に対して、どの資料を出すかを選ぶ組み合わせの演習と、明細と試算表の不一致・残高確認の差異・質問への答え方・指摘への対応の確認問題 6 問
tags:
  [監査対応, PBC, 残高確認, 銀行勘定調整表, 年齢表, カットオフ, 繰延税金資産, 減損, 財務制限条項]
basis:
  - name: 一般的な監査対応の実務（資料の名前・様式は監査人・会社によって違う）
asOf: '2026-10-01'
updated: '2026-10-18'
match:
  title: 監査人の依頼に、どの資料を出す？
  intro: 3 月決算の会社の期末監査です。監査人から、確かめたいことと一緒に資料の依頼が届きました。それぞれに一番ふさわしい資料を選んでください（使わない資料もあります）。
  optionsLabel: 提出する資料
  options:
    - id: bank
      text: 銀行の残高証明書と銀行勘定調整表
    - id: aging
      text: 売掛金の年齢表（取引先別・発生からの経過期間）
    - id: cutoff
      text: 期末日前後の出荷記録と売上計上の明細
    - id: fixed
      text: 固定資産の増減明細と減価償却の計算表
    - id: impairment
      text: 減損の兆候の検討資料（店舗・事業ごとの損益と将来の計画）
    - id: subsequent
      text: 期末日後の支払いの一覧
    - id: dta
      text: 将来の課税所得の見込みと、一時差異が解消する時期の一覧
    - id: minutes
      text: 取締役会・経営会議の議事録
    - id: loan
      text: 借入金の契約書と返済予定表
    - id: stocktake
      text: 実地棚卸の計画書・結果と、評価減の計算
  items:
    - id: m1
      prompt: 預金の期末残高が本当にあるかを確かめたい。
      answer: bank
      explanation: 預金の実在性は、銀行が発行する残高証明書（と監査人の残高確認）で確かめます。帳簿との差（未取付小切手など）は銀行勘定調整表で説明します。
    - id: m2
      prompt: 貸倒引当金の見積りが十分かを確かめたい。
      answer: aging
      explanation: 回収が遅れている債権を見るには、発生からの経過期間で分けた年齢表を使います。長く残っている取引先の状況も説明できるようにします。
    - id: m3
      prompt: 売上が正しい期に計上されているかを確かめたい。
      answer: cutoff
      explanation: 期末日の前後の出荷・検収の記録と売上の計上日を突き合わせて、期ズレ（カットオフ）が無いかを確かめます。
    - id: m4
      prompt: 買掛金・未払金の計上漏れが無いかを確かめたい。
      answer: subsequent
      explanation: 期末日後に支払ったもののうち、期末までに発生していたものが計上されているかを確かめます（網羅性）。
    - id: m5
      prompt: 繰延税金資産を計上してよいか（回収できるか）を確かめたい。
      answer: dta
      explanation: 繰延税金資産は、将来の課税所得で一時差異が解消するときに税金が減る分だけ計上できます。課税所得の見込み（事業計画）と解消の時期（スケジューリング）を示します。
    - id: m6
      prompt: 業績が悪い店舗の固定資産について、損失を計上しなくてよいかを確かめたい。
      answer: impairment
      explanation: 減損の兆候（営業損益が続けてマイナスなど）の有無と、兆候があるときの将来の計画を示す資料です。
    - id: m7
      prompt: 当期の重要な決定（新しい取引・大きな投資・訴訟など）を漏れなく把握したい。
      answer: minutes
      explanation: 取締役会・経営会議の議事録は、会計処理や開示が必要な出来事を把握する基本の資料です。
    - id: m8
      prompt: 借入金に、守れないと一括返済になる条件が付いていないかを確かめたい。
      answer: loan
      explanation: 財務制限条項（純資産や利益の水準を保つ約束など）は契約書で確かめます。守れないと、一括返済や開示（継続企業の前提）の検討が必要になります。
    - id: m9
      prompt: 期末の在庫の数量と金額が正しいかを確かめたい。
      answer: stocktake
      explanation: 実地棚卸の計画と結果（監査人は立会もします）、滞留・陳腐化の評価減の計算を示します。
questions:
  - id: q1
    context: 売掛金の取引先別の明細を作ったところ、合計は 5,230,000 円、試算表の売掛金は 5,320,000 円だった。
    question: 差額 90,000 円は 9 で割り切れる。まず疑うべき誤りは？
    choices: [数字の入れ替え（転記の誤り）, 消費税の計算の誤り, 為替の換算の誤り]
    answer: 0
    explanation: 2 つの数字を入れ替えて転記すると（例 — 5,320,000 を 5,230,000 と書く）、差額は 9 で割り切れます。原因を見つけて一致させてから、監査人に提出します。
  - id: q2
    question: 監査人から「売上総利益率が前期 30% から当期 25% に下がった理由は？」と聞かれた。よい答え方は？
    choices:
      - 主な原因は A 製品の値下げ（売上総利益への影響 △2,000 万円）と原材料の値上がり（△1,500 万円）です。製品別の損益の明細を添付します
      - 市況が悪かったためです
      - 担当部署に聞いてください
    answer: 0
    explanation: 事実・金額・根拠の資料をセットで答えます。分からないことは推測で答えず、確認してから回答します。
  - id: q3
    context: 残高確認で、仕入先 B 社の回答は買掛金 1,200,000 円、当社の帳簿は 1,000,000 円だった。B 社は 3 月 30 日に 200,000 円の商品を出荷し、当社には 4 月 2 日に届いた。
    question: 経理の対応として適切なものは？
    choices:
      - 差異の内容（期末日の未着の商品）を調べ、取引の条件に照らして当期に計上すべきかを検討し、説明の資料を作る
      - 先方の誤りとして無視する
      - 何も確かめずに先方の金額に合わせる
    answer: 0
    explanation: 差異は、どちらが正しいかを取引の事実と条件（所有権がいつ移るか）で判断します。調べた結果と根拠を、監査人に説明できる形で残します。
  - id: q4
    question: 監査人が未払費用の計上漏れ 50,000 円（重要性の基準より小さい）を見つけた。望ましい対応は？
    choices:
      - 原則として修正する。修正しない場合は未修正の虚偽表示として集計され、経営者確認書に一覧が添付される
      - 小さいので記録も不要
      - 翌期に計上すれば同じ
    answer: 0
    explanation: 小さな誤りも積み重なると重要性を超えるおそれがあります。原因を調べ、同じ誤りが他に無いかも確かめます。
  - id: q5
    question: 依頼された資料が期限に間に合いそうにない。どうする？
    choices:
      - 期限の前に監査人に連絡し、いつ出せるかを伝えて新しい期限を合意する
      - 期限が過ぎてから出す
      - 出さずに済むのを待つ
    answer: 0
    explanation: 監査の日程は決算発表から逆算されています。早めに連絡すれば、監査人も作業の順番を入れ替えられます。
  - id: q6
    question: 人件費の確かめのために給与台帳を求められた。注意することは？
    choices:
      - 必要な範囲（期間・項目）に絞り、受け渡しの方法（共有の場所・パスワードなど）を決めて渡す
      - マイナンバーを含め、全部の情報をメールで送る
      - 個人情報なので一切出さない
    answer: 0
    explanation: 監査に必要な資料は出しますが、個人情報は目的に必要な範囲に絞り、安全な方法で受け渡します。
