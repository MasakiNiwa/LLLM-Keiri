id: ai-accounting
title: 経理 × AI のきほん
track: ai
order: 1
level: 3
summary: AI が得意な仕事、AI-OCR の確認、生成 AI の使い方、異常検知、AI エージェントの統制、リスク、デジタルインボイスの 8 問
tags: [AI, 生成 AI, AI-OCR, ハルシネーション, AI エージェント, デジタルインボイス, 内部統制]
basis:
  - name: 一般的な経理実務と AI 活用の考え方
asOf: '2026-10-01'
updated: '2026-10-18'
questions:
  - id: q1
    question: AI と自動化で大きく減らしやすい経理の仕事は？
    choices: [会計処理の方針の決定, 入金消込や残高の照合, 監査人への説明の責任]
    answer: 1
    explanation: 量が多くルールがはっきりした照合は自動化しやすい仕事です。判断と説明の責任は人（会社）に残ります。
  - id: q2
    question: 仕訳の自動提案を導入するとき、特に注意することは？
    choices:
      - 過去の仕訳の誤りも、AI がまねてしまう
      - AI の提案は常に正しいので確認は不要
      - 摘要は書かなくてよくなる
    answer: 0
    explanation: 過去のデータから学ぶ仕組みは、過去の誤りも続けます。導入前にマスタと過去の仕訳を見直します。
  - id: q3
    question: 生成 AI に経営報告の数字の合計を計算させた。正しい使い方は？
    choices:
      - そのまま報告に使う
      - 計算は表計算や会計システムで行い、AI には文章の下書きを頼む
      - 2 回聞いて同じなら使う
    answer: 1
    explanation: 生成 AI は計算を間違えることがあります。数字はプログラムで計算し、AI は説明や下書きに使います。
  - id: q4
    question: 生成 AI が、もっともらしいが存在しない条文を答えることを何という？
    choices: [ハルシネーション, RAG, AI-OCR]
    answer: 0
    explanation: ハルシネーションと呼びます。根拠は条文・基準・通達などの一次情報で確かめます。
  - id: q5
    question: 仕訳の全件分析で、不正の兆候として注目する例は？
    choices:
      - 決算日の直前に、ふだん仕訳を入れない人が入れた多額の仕訳
      - 毎月同じ金額の家賃の仕訳
      - 給与の支払日の普通預金の減少
    answer: 0
    explanation: 時間・人・金額のいつもと違う組み合わせは、確かめるべき仕訳です。ただし抽出されただけで不正とは言えません。
  - id: q6
    question: AI エージェントに経理の作業を任せるときの統制として適切なのは？
    choices:
      - 起票から承認・支払いまで AI に任せる
      - 権限を最小限にし、仕訳や支払いは人が承認して確定させる
      - 記録は残さない
    answer: 1
    explanation: 権限の最小化・職務分掌・人の承認・記録は、人の担当者と同じく AI にも必要です。
  - id: q7
    question: AI のモデルや設定が変わって、同じ入力で結果が変わるリスクへの対応は？
    choices: [変更管理（変更の記録と変更後のテスト）, アクセス管理を無くす, 何もしない]
    answer: 0
    explanation: IT 全般統制の変更管理の考え方で、変更を記録し、変更後に結果を確かめます。
  - id: q8
    question: デジタルインボイス（Peppol・JP PINT）の特徴は？
    choices:
      - 紙の請求書をスキャンした画像のこと
      - システムが読める決まった形のデータで請求書をやり取りする
      - 電子メールに PDF を添付すること
    answer: 1
    explanation: 最初から機械が読める形のデータなので、読み取りの誤りが起こらず、会計システムにそのまま取り込めます。
