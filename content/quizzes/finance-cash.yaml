id: finance-cash
title: 資金繰りのきほん
track: finance
order: 1
level: 3
summary: 利益とお金のずれ、黒字倒産、資金繰り表の区分、運転資金と CCC、資金調達、資金の内部統制の 8 問
tags: [資金繰り, 黒字倒産, 資金繰り表, 運転資金, CCC, 資金調達]
basis:
  - name: 一般的な資金管理の実務
asOf: '2026-10-01'
updated: '2026-10-18'
questions:
  - id: q1
    question: 会社が倒産するのは、どんなとき？
    choices: [利益がマイナスになったとき, 支払いができなくなったとき, 売上が減ったとき]
    answer: 1
    explanation: 赤字でもお金があれば支払いは続けられ、黒字でもお金がなければ支払いができず倒産します（黒字倒産）。
  - id: q2
    question: 売上が急に伸びているとき、資金繰りで特に注意することは？
    choices:
      - 売掛金と在庫が増えて、運転資金が多く必要になる
      - 減価償却費が増える
      - 利益が減る
    answer: 0
    explanation: 先に仕入れ・人件費の支払いがあり、回収は後になるので、運転資金が増えてお金が足りなくなりやすくなります。
  - id: q3
    question: 資金繰り表で、設備の購入代金の支払いはどの区分？
    choices: [経常支出, 経常外収支, 財務収支]
    answer: 1
    explanation: 設備の購入・売却、税金の納付などは、本業の経常的な収支とは分けて経常外収支にします。
  - id: q4
    question: 必要運転資金の計算式は？
    choices:
      - 売上債権 ＋ 棚卸資産 − 仕入債務
      - 流動資産 − 流動負債
      - 売上高 − 売上原価
    answer: 0
    explanation: 売上債権と棚卸資産で立て替えている額から、仕入債務で立て替えてもらっている額を引きます。
  - id: q5
    question: CCC を短くする打ち手として適切でないものは？
    choices: [売掛金の回収を早める, 滞留在庫を減らす, 在庫を多めに積み増す]
    answer: 2
    explanation: 在庫を増やすと棚卸資産回転日数が延び、CCC は長くなります。
  - id: q6
    question: 当座貸越の特徴は？
    choices:
      - 限度額の範囲で、必要なときに借りて返せる
      - 必ず 5 年以上の分割返済になる
      - 返済がいらない
    answer: 0
    explanation: 当座貸越は、契約した限度額まで必要なときに借り、余裕があるときに返せる借入れです。
  - id: q7
    question: 補助金の資金繰り上の注意点は？
    choices: [すぐに全額入金される, 後払いが多く、入金までの資金が必要, 返済が必要]
    answer: 1
    explanation: 補助金は返済不要ですが、事業を行ったあとに入金されることが多いので、それまでの資金を用意します。
  - id: q8
    question: 振込の不正を防ぐ内部統制としてもっとも適切なのは？
    choices:
      - 振込データの作成と承認を同じ担当者が行う
      - 振込データの作成と承認を別の人が行い、口座の変更は登録の連絡先で確かめる
      - 振込は毎回現金で行う
    answer: 1
    explanation: 職務の分離と、口座変更の確認（メール以外の登録済みの連絡先で）が基本です。
