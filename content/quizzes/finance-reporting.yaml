id: finance-reporting
title: 経営への報告のための分析
track: finance
order: 2
level: 4
summary: 予実差異、価格差異・数量差異、ROE のデュポン分解、フリー・キャッシュ・フロー、部門別損益、経営報告の書き方の 8 問
tags: [予実差異, 価格差異, 数量差異, デュポン分解, フリー・キャッシュ・フロー, 貢献利益, 経営報告]
basis:
  - name: 一般的な管理会計・財務分析の実務
asOf: '2026-10-01'
updated: '2026-10-18'
questions:
  - id: q1
    question: 予算 単価 1,000 円 × 10,000 個、実績 単価 950 円 × 11,000 個。価格差異はいくら？
    choices:
      - △500,000 円（不利）
      - △550,000 円（不利）
      - 1,000,000 円（有利）
    answer: 1
    explanation: 価格差異 ＝（950 − 1,000）× 実績数量 11,000 ＝ △550,000 円。数量差異は（11,000 − 10,000）× 予算単価 1,000 ＝ 1,000,000 円の有利です。
  - id: q2
    question: 販管費が予算を 300 万円上回った。報告で添えるべき言葉は？
    choices: [有利差異, 不利差異, 符号だけで十分]
    answer: 1
    explanation: 費用は実績が予算を上回ると会社にとって不利です。符号だけでなく、有利・不利と原因を添えます。
  - id: q3
    question: 売上の増減に合わせて変動費の予算を調整したものを何という？
    choices: [固定予算, 変動予算, 着地見込み]
    answer: 1
    explanation: 変動予算と比べると、売上の増減による影響を除いて、費用の効率の良し悪しを見られます。
  - id: q4
    question: 売上高純利益率 5%、総資産回転率 0.8 回、財務レバレッジ 2.5 倍。ROE は？
    choices: ['4%', '10%', '8.3%']
    answer: 1
    explanation: ROE ＝ 5% × 0.8 × 2.5 ＝ 10%。ROA は 5% × 0.8 ＝ 4% です。
  - id: q5
    question: 借入れを増やして ROE が上がった。注意することは？
    choices:
      - 財務レバレッジが上がり、金利の負担と倒産のリスクも増えている
      - 利益率が上がったので問題はない
      - 総資産回転率が上がったので効率が良くなった
    answer: 0
    explanation: レバレッジで上がった ROE は、利益率や効率の改善とは中身が違います。自己資本比率と合わせて見ます。
  - id: q6
    question: 営業キャッシュ・フロー 120、投資キャッシュ・フロー △80。簡便なフリー・キャッシュ・フローは？
    choices: ['200', '40', '△40']
    answer: 1
    explanation: FCF ＝ 営業 CF ＋ 投資 CF ＝ 120 − 80 ＝ 40。返済・配当・新しい投資の原資になります。
  - id: q7
    question: B 部門は、貢献利益 15、配賦された本社費 20 で、部門の営業利益が △5。B 部門をやめると、会社全体の利益は？
    choices: [5 増える, 15 減る, 変わらない]
    answer: 1
    explanation: 本社費 20 はやめても残るので、会社全体では B 部門の貢献利益 15 を失います。判断には、やめたら本当に無くなる収益と費用を使います。
  - id: q8
    question: 経営陣への月次報告の 1 枚目に、まず書くべきものは？
    choices: [全科目の試算表, 結論（良いか悪いかと主な原因）, 仕訳の一覧]
    answer: 1
    explanation: 結論から書き、主要な数字・差異の原因・着地見込み・判断してほしいことを続けます。
