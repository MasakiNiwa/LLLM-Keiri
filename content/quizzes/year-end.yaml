id: year-end
title: 年末調整と年次業務
track: practice
order: 1
level: 3
summary: 年末調整の対象者・申告書・計算の順番・端数処理・精算、源泉徴収票と法定調書、給与支払報告書、償却資産の申告の 10 問（2025 年分のルール）
tags: [年末調整, 源泉徴収票, 法定調書, 給与支払報告書, 償却資産]
basis:
  - name: 所得税法・地方税法
  - name: 国税庁「令和 7 年分 年末調整のしかた」
asOf: '2026-10-01'
updated: '2026-10-18'
questions:
  - id: q1
    question: 年末調整をする理由としてもっとも適切なのは？
    choices:
      - 毎月の源泉徴収は概算なので、1 年分の正しい税額と精算するため
      - 住民税を計算するため
      - 社会保険料を見直すため
    answer: 0
    explanation: 生命保険料や配偶者の所得など年の途中で反映できないものを含め、1 年分の年税額を計算して過不足を精算します。
  - id: q2
    question: 年末調整の計算の順番として正しいものは？
    choices:
      - 給与所得 → 所得控除 → 課税所得 → 税率 → ×102.1%
      - 所得控除 → 給与所得 → 税率 → 課税所得
      - 税率 → 給与所得 → 所得控除
    answer: 0
    explanation: 給与所得（給与所得控除後）から所得控除を引いて課税所得を出し、速算表で税額を求め、復興特別所得税を含めて 102.1% にします。
  - id: q3
    question: 2025 年分で、給与の収入金額が 150 万円の人の給与所得控除額は？
    choices: [55 万円, 65 万円, 75 万円]
    answer: 1
    explanation: 2025 年分から、給与所得控除の最低額は 65 万円（収入 190 万円以下）になりました。
  - id: q4
    question: 19 歳以上 23 歳未満の扶養親族（特定扶養親族）の扶養控除の額は？
    choices: [38 万円, 48 万円, 63 万円]
    answer: 2
    explanation: 特定扶養親族は 63 万円です（一般の扶養親族は 38 万円）。
  - id: q5
    question: 課税給与所得金額と年調年税額の端数処理の組み合わせは？
    choices:
      - 課税給与所得金額は 1,000 円未満、年税額は 100 円未満を切り捨て
      - どちらも 1 円未満を切り捨て
      - どちらも四捨五入
    answer: 0
    explanation: 課税給与所得金額は 1,000 円未満、年調年税額（× 102.1% の後）は 100 円未満を切り捨てます。
  - id: q6
    question: 年末調整で還付する税額は、どこから返す？
    choices:
      - 会社の利益から
      - その月に納める源泉所得税から差し引いて返す
      - 税務署に請求してから返す
    answer: 1
    explanation: 還付は、その月（足りなければ翌月以降）に納める源泉所得税から差し引いて本人に返します。会社の費用にはなりません。
  - id: q7
    question: 源泉徴収票を本人に渡す期限は？
    choices: [12 月 31 日, 翌年 1 月 31 日, 翌年 3 月 15 日]
    answer: 1
    explanation: 翌年 1 月 31 日までに本人に渡します。税務署への提出分は、法定調書合計表とあわせて出します。
  - id: q8
    question: 税理士（個人）に 1 年間で 30 万円の報酬を払った。報酬・料金等の支払調書は？
    choices: [出さなくてよい, 税務署に出す, 市区町村に出す]
    answer: 1
    explanation: 弁護士・税理士などへの報酬は、同じ人に年 5 万円を超えて払ったときに、支払調書を税務署に出します。
  - id: q9
    question: 給与支払報告書の使われ方は？
    choices: [翌年度の住民税の計算, 法人税の計算, 社会保険料の計算]
    answer: 0
    explanation: 市区町村は、給与支払報告書をもとに翌年度の住民税を計算し、6 月からの特別徴収税額を会社に通知します。
  - id: q10
    question: 償却資産の申告について正しいものは？
    choices:
      - 12 月 31 日に持っている資産を、3 月 15 日までに申告する
      - 1 月 1 日に持っている資産を、1 月 31 日までに市区町村に申告する
      - 自動車も含めて、すべての資産を申告する
    answer: 1
    explanation: 1 月 1 日（賦課期日）に持っている事業用の償却資産を、1 月 31 日までに申告します。自動車税がかかる車両は対象外です。
