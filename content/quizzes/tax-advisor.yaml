id: tax-advisor
title: 税理士と話すための税務
track: tax
order: 3
level: 4
summary: 税務用語、役員給与、交際費、少額資産、貸倒損失、課税区分、仕入税額控除、インボイスの経過措置、修正申告と加算税の 10 問
tags:
  [税理士, 役員給与, 交際費, 少額減価償却資産, 貸倒損失, 課税区分, 課税売上割合, 修正申告, 加算税]
basis:
  - name: 法人税法・消費税法・国税通則法
asOf: '2026-10-01'
updated: '2026-10-18'
questions:
  - id: q1
    question: 税理士に「この減価償却費は損金経理が必要です」と言われた。意味は？
    choices:
      - 決算（損益計算書）で費用として計上しないと損金にできない
      - 申告書の別表だけで減算すればよい
      - 税務署に届け出る必要がある
    answer: 0
    explanation: 減価償却費などは、決算で費用として処理（損金経理）したものだけが損金になります。決算前に確かめる必要があります。
  - id: q2
    question: 申告した法人税が多すぎたと気づいた。税務署に減額を求める手続は？
    choices: [修正申告, 更正の請求, 予定申告]
    answer: 1
    explanation: 多すぎたときは更正の請求（原則 5 年以内）、少なかったときは修正申告です。
  - id: q3
    question: 期の途中（期首から 6 か月後）に役員報酬を増額した。法人税での主な問題は？
    choices:
      - 定期同額給与に当たらず、増額分が損金にならないおそれがある
      - 消費税が増える
      - 特に問題はない
    answer: 0
    explanation: 定期同額給与の改定は原則として期首から 3 か月以内です。それ以外の改定は、増額分が損金にならないことがあります。
  - id: q4
    question: 取引先との飲食費を会議費にできる可能性を高めるために、領収書に書いておくべきことは？
    choices: [相手先の名前・参加人数・目的, 自分の名前だけ, 何も書かなくてよい]
    answer: 0
    explanation: 1 人あたりの金額の基準（2024 年 4 月 1 日以後は 1 万円以下）を満たすことを示すには、参加者・人数などの記録が必要です。
  - id: q5
    question: 取得価額 8 万円のパソコン（1 台）。法人税の主な扱いは？
    choices:
      - 取得した期に全額を損金にできる（損金経理が条件）
      - 必ず耐用年数で減価償却する
      - 損金にならない
    answer: 0
    explanation: 10 万円未満の少額の減価償却資産は、取得した期に全額を損金にできます。
  - id: q6
    question: 売掛金の回収が「難しそう」になった。法人税で貸倒損失にできる？
    choices:
      - 回収が難しそうなだけではできない（法的に消えた・回収できないことが明らかなどが必要）
      - 経理が判断すればいつでもできる
      - 1 年たてば必ずできる
    answer: 0
    explanation: 貸倒損失には一定の事実が必要です。それまでは会計では貸倒引当金で対応し、督促の記録などを残します。
  - id: q7
    question: 従業員の給与の消費税の区分は？
    choices: [課税, 非課税, 不課税（対象外）]
    answer: 2
    explanation: 給与は事業者間の取引ではないので、消費税の対象外（不課税）です。
  - id: q8
    question: 課税売上高 5 億円以下で、課税売上割合が 98%。仕入の消費税は？
    choices: [全額控除できる, 個別対応方式で計算する, 控除できない]
    answer: 0
    explanation: 課税売上高 5 億円以下かつ課税売上割合 95% 以上なら、全額控除できます。
  - id: q9
    question: 免税事業者（インボイスを出せない事業者）からの仕入。経過措置の期間中は？
    choices:
      - 仕入の消費税の一部を控除できる（帳簿への記載が必要）
      - 全額を控除できる
      - 一切控除できない
    answer: 0
    explanation: 経過措置の期間中は一定割合を控除できます。割合と期間は改正で見直されることがあるので、最新の規定を確かめます。
  - id: q10
    question: 税務調査の連絡の前に、自分で申告の誤り（税額が少なかった）に気づいた。望ましい対応は？
    choices:
      - すぐに税理士に相談し、修正申告をする
      - 調査が来るまで待つ
      - 翌期の申告で調整する
    answer: 0
    explanation: 調査の連絡の前に自主的に修正申告すると、加算税がかからない・軽くなる場合があります。
