id: jsox-rcm-case
title: 事例で考える RCM（販売・購買・決算）
track: internal-control
order: 2
level: 4
summary: 業務の説明を読んで、リスクに対応する要件（アサーション）とコントロールの種類、不足しているコントロールを考える 10 問
tags: [RCM, アサーション, 予防的統制, 発見的統制, 職務の分離, 決算・財務報告プロセス]
basis:
  - name: 財務報告に係る内部統制の評価及び監査に関する実施基準（企業会計審議会、2023 年 4 月改訂）
asOf: '2026-10-01'
updated: '2026-10-18'
questions:
  - id: q1
    context: 販売プロセス — 営業担当者が受注を販売管理システムに入力し、営業課長が承認すると、出荷の指示が出る。
    question: 営業課長の承認は、主にどのリスクに対応する？
    choices:
      - 受注のない架空の出荷・売上が計上される（実在性）
      - 出荷したのに売上が漏れる（網羅性）
      - 売掛金の評価が過大になる（評価の妥当性）
    answer: 0
    explanation: 承認された受注がないと出荷できないので、架空の取引を事前に防ぐ予防的統制で、実在性に対応します。
  - id: q2
    context: 販売プロセス — 月末に経理担当者が、倉庫の出荷記録と売上の計上を照合し、差異があれば理由を調べて記録を残す。
    question: このコントロールの種類と、主に対応する要件は？
    choices: [予防的統制・実在性, 発見的統制・網羅性, 予防的統制・表示の妥当性]
    answer: 1
    explanation: 出荷したのに売上が漏れていないかを事後に見つけるので、発見的統制で網羅性に対応します。
  - id: q3
    context: 決算 — 3 月決算の会社。3 月 31 日に出荷し、4 月 2 日に得意先が受け取った商品がある（出荷基準で売上を計上している）。
    question: 期末前後の出荷と売上の計上日を照合するコントロールが守る要件は？
    choices: [権利と義務の帰属, 期間配分の適切性, 表示の妥当性]
    answer: 1
    explanation: 売上が正しい期間に計上されているか（カットオフ）を確かめるので、期間配分の適切性です。
  - id: q4
    context: 購買プロセス — 購買担当者が、発注・検収の入力・仕入先への支払いの起票まで、1 人で行っている。
    question: もっとも問題なのは？
    choices: [職務の分離がない, IT 業務処理統制がない, 統制環境がない]
    answer: 0
    explanation: 発注・検収・支払いを 1 人で完結できると、架空の仕入や不正な支払いを防げません。職務を分けるか、別の人の承認を入れます。
  - id: q5
    context: 決算 — 経理課長が、年齢調べ表（売掛金の滞留期間の一覧）をもとに、担当者が計算した貸倒引当金をレビューし、レビューのサインを残している。
    question: このコントロールが主に対応する要件は？
    choices: [実在性, 網羅性, 評価の妥当性]
    answer: 2
    explanation: 回収できない売掛金に見合う引当金が計上されているか、適切な金額かを確かめるので、評価の妥当性です。
  - id: q6
    context: 運用状況の評価 — 「経理課長が手入力の仕訳を承認する」コントロールについて、サンプル 25 件を選んだところ、2 件に承認の記録がなかった。担当者は「口頭で承認をもらった」と言っている。
    question: 評価としてもっとも適切なのは？
    choices:
      - 口頭で承認したので、問題ない
      - 承認の証跡がないので、運用上の逸脱として扱い、原因と影響を検討する
      - サンプルを入れ替えて、承認のあるものだけで評価する
    answer: 1
    explanation: 記録がなければ、承認したことを示せません。逸脱として扱い、原因・範囲・影響（不備かどうか）を検討します。都合のよいサンプルへの入れ替えは不適切です。
  - id: q7
    context: IT — 会計システムの権限設定を確かめたところ、経理担当者全員が「仕訳の起票」と「仕訳の承認」の両方の権限を持っていた。
    question: どの統制の不備にあたる？
    choices: [IT 全般統制（アクセス管理）, 分析的レビュー, モニタリング]
    answer: 0
    explanation: 起票者が自分で承認できる権限設定は、アクセス管理（職務の分離を支える権限の管理）の不備です。
  - id: q8
    context: 決算 — 減損損失の見積りに使う将来キャッシュ・フローは、事業部が作った計画をそのまま使っている。経理部門は数字を転記しているだけである。
    question: 不足しているコントロールとして、もっとも適切なのは？
    choices:
      - 計画の前提（売上の伸び・割引率など）の合理性を、経理部門の上長がレビューする
      - 転記の回数を増やす
      - 減損の見積りをやめる
    answer: 0
    explanation: 見積りは誤りが起きやすく、経営者の偏りも入りやすい領域です。前提の合理性を確かめるレビュー（過去の計画と実績の比較など）が必要です。
  - id: q9
    context: 開示 — 有価証券報告書の注記の数字は、担当者が表計算ソフトで作り、そのまま原稿に貼っている。
    question: もっとも有効なコントロールは？
    choices:
      - 注記の数字を、財務諸表・総勘定元帳と別の人が照合し、記録を残す
      - 表計算ソフトの色を変える
      - 注記を減らす
    answer: 0
    explanation: 表示の妥当性を守るため、開示の数字を元の帳簿と照合する発見的統制を入れます。表計算ソフトの計算式の保護も有効です。
  - id: q10
    context: 全社 — 経営者が、目標の利益に届かせるため、経理部長に期末の売上の前倒し計上を指示した。
    question: これにあたるのは？
    choices: [経営者による内部統制の無効化, IT 業務処理統制の不備, 運用状況の評価]
    answer: 0
    explanation: 経営者自身が統制を無視・無効にすることで、内部統制の限界の 1 つです。2023 年の改訂でも対応が強調されました。取締役会・監査役・内部通報制度などの全社的な統制が重要です。
