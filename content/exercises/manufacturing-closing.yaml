id: manufacturing-closing
title: 製造業の決算（原価の流れから財務諸表まで）
summary: 材料・労務費・製造間接費の消費、予定配賦と配賦差異、完成品・売上原価への振替から、貸倒引当金・法人税等まで、製造業の 1 年の原価の流れを 10 の仕訳で通しで解きます
level: 4
closingDate: '2026-03-31'
basis:
  - name: 原価計算基準
  - name: 企業会計原則
asOf: '2026-10-01'
updated: '2026-10-18'
lessons:
  - cost-basics
  - cost-elements
  - cost-overhead
  - cost-job-order
note: 会計期間は 2025 年 4 月 1 日〜2026 年 3 月 31 日。学習用に、1 年分の原価の流れを期末にまとめて記帳する。材料の購入は材料勘定、賃金の支払いは賃金勘定、工場の電力料などの間接経費は支払時に製造間接費勘定に記帳済み。製造間接費は直接作業時間を基準に予定配賦する。建物・機械装置はすべて工場で使っている。消費税・税効果は考えない。
trialBalance: |
  普通預金 3,000,000 / 買掛金 1,000,000
  売掛金 2,400,000 / 減価償却累計額 1,500,000
  材料 3,300,000 / 資本金 6,000,000
  仕掛品 200,000 / 繰越利益剰余金 1,300,000
  製品 500,000 / 売上 12,000,000
  建物 5,000,000 /
  機械装置 2,000,000 /
  賃金 2,600,000 /
  製造間接費 900,000 /
  給料 1,200,000 /
  支払家賃 600,000 /
  仮払法人税等 100,000 /
adjustments:
  - id: a1
    question: 材料の期末棚卸高は 400,000 円（帳簿と実地は一致）。当期の消費高のうち、直接材料費は 2,500,000 円、残りは間接材料費である。
    answer: |
      仕掛品 2,500,000 / 材料 2,900,000
      製造間接費 400,000 /
    hint: 消費高 ＝ 期首 ＋ 購入（材料勘定の残高 3,300,000）− 期末 400,000
    explanation: 消費高 2,900,000 円のうち、直接材料費は仕掛品へ、間接材料費 400,000 円は製造間接費へ振り替えます。
  - id: a2
    question: 賃金の消費高 2,600,000 円のうち、直接工の直接作業分 2,000,000 円は直接労務費、残りは間接労務費である（未払・前払は無いものとする）。
    answer: |
      仕掛品 2,000,000 / 賃金 2,600,000
      製造間接費 600,000 /
    explanation: 直接労務費は仕掛品へ、間接労務費 600,000 円は製造間接費へ振り替えます。
  - id: a3
    question: 工場の建物・機械装置の当期の減価償却費は 500,000 円（間接法）。工場の減価償却費は製造原価に含める。
    answer: 製造間接費 500,000 / 減価償却累計額 500,000
    explanation: 工場で使う固定資産の減価償却費は間接経費なので、製造間接費に集めます。製造間接費の実際発生額は 900,000 ＋ 400,000 ＋ 600,000 ＋ 500,000 ＝ 2,400,000 円になります。
  - id: a4
    question: 製造間接費を予定配賦する。予定配賦率は直接作業時間 1 時間あたり 1,250 円、当期の実際の直接作業時間は 1,880 時間である。
    answer: 仕掛品 2,350,000 / 製造間接費 2,350,000
    explanation: 1,250 円 × 1,880 時間 ＝ 2,350,000 円を仕掛品に配賦します。
  - id: a5
    question: 製造間接費の実際発生額と予定配賦額の差額を、原価差異（製造間接費配賦差異）勘定に振り替える。
    answer: 原価差異 50,000 / 製造間接費 50,000
    explanation: 実際 2,400,000 − 予定 2,350,000 ＝ 50,000 円の借方差異（不利差異）です。製造間接費勘定の借方に残った 50,000 円を原価差異に振り替えます。
  - id: a6
    question: 仕掛品の期末棚卸高は 300,000 円だった。当期の完成品の原価を製品勘定に振り替える。
    answer: 製品 6,750,000 / 仕掛品 6,750,000
    hint: 当期製造費用 ＝ 直接材料費 ＋ 直接労務費 ＋ 製造間接費（予定配賦額）
    explanation: 当期製造費用は 2,500,000 ＋ 2,000,000 ＋ 2,350,000 ＝ 6,850,000 円。期首仕掛品 200,000 円を足し、期末仕掛品 300,000 円を引いた 6,750,000 円が当期製品製造原価です。
  - id: a7
    question: 製品の期末棚卸高は 450,000 円だった。販売した製品の原価を売上原価勘定に振り替える。
    answer: 売上原価 6,800,000 / 製品 6,800,000
    explanation: 期首製品 500,000 ＋ 当期製品製造原価 6,750,000 − 期末製品 450,000 ＝ 6,800,000 円です。
  - id: a8
    question: 原価差異（製造間接費配賦差異）の残高は、すべて当期の売上原価に加減する。
    answer: 売上原価 50,000 / 原価差異 50,000
    explanation: 借方差異（不利差異）なので、売上原価に加えます。売上原価は 6,850,000 円になります。
  - id: a9
    question: 売掛金の期末残高に対して 1% の貸倒引当金を設定する（前期からの残高は無い）。
    answer: 貸倒引当金繰入 24,000 / 貸倒引当金 24,000
    explanation: 2,400,000 × 1% ＝ 24,000 円です。
  - id: a10
    question: 当期の法人税等は、税引前当期純利益の 30% とする。中間納付額 100,000 円は仮払法人税等で処理している。
    answer: |
      法人税等 997,800 / 仮払法人税等 100,000
      / 未払法人税等 897,800
    hint: 税引前当期純利益 ＝ 売上 − 売上原価 − 給料 − 支払家賃 − 貸倒引当金繰入
    explanation: 税引前当期純利益は 12,000,000 − 6,850,000 − 1,200,000 − 600,000 − 24,000 ＝ 3,326,000 円。法人税等はその 30% の 997,800 円で、中間納付額を引いた 897,800 円が未払法人税等です。当期純利益は 2,328,200 円になります。
