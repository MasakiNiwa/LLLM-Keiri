id: bookkeeping2-closing
title: 簿記 2 級レベルの決算（有価証券・税効果・リース・棚卸減耗）
summary: 棚卸減耗損と商品評価損、売買目的・その他有価証券の評価（税効果つき）、ファイナンス・リースの支払い、経過勘定、法人税等まで、11 の決算整理を通しで解きます
level: 4
closingDate: '2026-03-31'
basis:
  - name: 企業会計原則
  - name: 棚卸資産の評価に関する会計基準（企業会計基準第 9 号）
  - name: 金融商品に関する会計基準（企業会計基準第 10 号）
  - name: リース取引に関する会計基準（企業会計基準第 13 号）
  - name: 税効果会計に係る会計基準
asOf: '2026-10-01'
updated: '2026-10-18'
lessons:
  - standards-inventory-valuation
  - trade-securities
  - closing-lease
  - tax-tax-effect
note: 会計期間は 2025 年 4 月 1 日〜2026 年 3 月 31 日。三分法。減価償却累計額は、建物 1,800,000 円と備品 480,000 円の合計。リース資産は当期首にファイナンス・リース（利子抜き法、リース期間 5 年、リース料は年 110,000 円を毎年 3 月末に後払い）で計上済み。前期末の経過勘定は期首に再振替済み。法定実効税率は 30%。
trialBalance: |
  現金 120,000 / 買掛金 900,000
  当座預金 2,380,000 / 借入金 2,000,000
  売掛金 1,500,000 / リース債務 500,000
  売買目的有価証券 600,000 / 貸倒引当金 10,000
  繰越商品 400,000 / 減価償却累計額 2,280,000
  仮払法人税等 150,000 / 資本金 5,000,000
  建物 6,000,000 / 繰越利益剰余金 710,000
  備品 1,200,000 / 売上 12,000,000
  リース資産 500,000 / 受取配当金 30,000
  その他有価証券 800,000 /
  仕入 7,200,000 /
  給料 2,400,000 /
  保険料 120,000 /
  支払利息 60,000 /
adjustments:
  - id: a1
    question: 期首商品棚卸高 400,000 円を、繰越商品勘定から仕入勘定に振り替える。
    answer: 仕入 400,000 / 繰越商品 400,000
    explanation: 期首の在庫を仕入に加えて、売上原価の計算を始めます。
  - id: a2
    question: 期末商品の帳簿棚卸高は 500 個（原価 @1,000 円）である。帳簿棚卸高を繰越商品に振り替える。
    answer: 繰越商品 500,000 / 仕入 500,000
    hint: 減耗・評価損の前に、帳簿の数量 × 原価で振り替えます。
    explanation: 売上原価は 7,200,000 ＋ 400,000 − 500,000 ＝ 7,100,000 円になります。
  - id: a3
    question: 実地棚卸の数量は 480 個、正味売却価額は @950 円だった。棚卸減耗損と商品評価損を計上する。
    answer: |
      棚卸減耗損 20,000 / 繰越商品 44,000
      商品評価損 24,000 /
    explanation: 棚卸減耗損は 20 個 × @1,000 ＝ 20,000 円、商品評価損は 480 個 ×（1,000 − 950）＝ 24,000 円です。
  - id: a4
    question: 売掛金の期末残高に対して 2% の貸倒引当金を設定する（差額補充法）。
    answer: 貸倒引当金繰入 20,000 / 貸倒引当金 20,000
    explanation: 1,500,000 × 2% ＝ 30,000 円から、残高 10,000 円を引いた 20,000 円を繰り入れます。
  - id: a5
    question: 減価償却を定額法・残存価額 0・間接法で行う。建物は取得原価 6,000,000 円・耐用年数 30 年、備品は取得原価 1,200,000 円・耐用年数 5 年、リース資産は 500,000 円をリース期間 5 年で償却する。まとめて 1 つの仕訳にする。
    answer: 減価償却費 540,000 / 減価償却累計額 540,000
    explanation: 建物 200,000 ＋ 備品 240,000 ＋ リース資産 100,000 ＝ 540,000 円です。
  - id: a6
    question: 3 月末に支払ったリース料 110,000 円（当座預金）が未処理だった。利息分は 10,000 円とする。
    answer: |
      リース債務 100,000 / 当座預金 110,000
      支払利息 10,000 /
    explanation: リース料を元本（リース債務の減少）と利息に分けます。
  - id: a7
    question: 売買目的有価証券（帳簿価額 600,000 円）の期末の時価は 580,000 円だった。
    answer: 有価証券評価損 20,000 / 売買目的有価証券 20,000
    explanation: 売買目的有価証券は時価に評価替えし、差額は損益（有価証券評価損）にします。
  - id: a8
    question: その他有価証券（取得原価 800,000 円）の期末の時価は 850,000 円だった。全部純資産直入法により、税効果会計（法定実効税率 30%）を適用する。
    answer: |
      その他有価証券 50,000 / 繰延税金負債 15,000
      / その他有価証券評価差額金 35,000
    explanation: 評価差益 50,000 円のうち 30% の 15,000 円は将来の税金として繰延税金負債に、残りの 35,000 円をその他有価証券評価差額金（純資産）にします。損益には影響しません。
  - id: a9
    question: 保険料 120,000 円は、2025 年 8 月 1 日に 1 年分を支払ったものである。未経過分を繰り延べる。
    answer: 前払費用 40,000 / 保険料 40,000
    explanation: 4 月〜7 月の 4 か月分 40,000 円は来期の費用です。
  - id: a10
    question: 借入金 2,000,000 円の利息（年 3%）は毎年 12 月末に後払いしている。1 月〜3 月の 3 か月分を見越し計上する。
    answer: 支払利息 15,000 / 未払費用 15,000
    explanation: 2,000,000 × 3% × 3/12 ＝ 15,000 円です。
  - id: a11
    question: 当期の法人税等は 530,000 円と計算された。中間納付額 150,000 円は仮払法人税等で処理している。
    answer: |
      法人税等 530,000 / 仮払法人税等 150,000
      / 未払法人税等 380,000
    explanation: 中間納付額を差し引いた 380,000 円を未払法人税等にします。税引前当期純利益は 1,741,000 円、当期純利益は 1,211,000 円になります。
