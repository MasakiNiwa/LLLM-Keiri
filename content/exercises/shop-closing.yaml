id: shop-closing
title: 商品売買業の決算（精算表から財務諸表まで）
summary: 決算整理前残高試算表と 9 つの決算整理事項から、決算整理仕訳 → 精算表 → 損益計算書・貸借対照表までを通しで解きます。簿記 2 級・3 級の決算問題の基本の形です
level: 3
closingDate: '2026-03-31'
basis:
  - name: 企業会計原則
  - name: 消費税法（税抜経理）
asOf: '2026-10-01'
updated: '2026-10-18'
lessons:
  - closing-overview
  - closing-cost-of-sales
  - closing-depreciation
  - closing-bad-debts
  - closing-accruals
note: 会計期間は 2025 年 4 月 1 日〜2026 年 3 月 31 日。三分法・税抜経理。減価償却累計額は、備品 320,000 円と建物 900,000 円の合計。前期末に見越し・繰り延べた分は、期首に再振替済み。
trialBalance: |
  現金 85,000 / 買掛金 450,000
  普通預金 1,240,000 / 借入金 1,000,000
  売掛金 600,000 / 仮受消費税等 560,000
  繰越商品 120,000 / 貸倒引当金 5,000
  仮払消費税等 380,000 / 減価償却累計額 1,220,000
  仮払法人税等 100,000 / 資本金 2,000,000
  備品 800,000 / 繰越利益剰余金 524,500
  建物 3,000,000 / 売上 5,600,000
  仕入 3,800,000 / 受取家賃 60,000
  給料 1,200,000 /
  保険料 72,000 /
  支払利息 22,500 /
adjustments:
  - id: a1
    question: 期首商品棚卸高 120,000 円を、繰越商品勘定から仕入勘定に振り替える。
    answer: 仕入 120,000 / 繰越商品 120,000
    hint: しーくり（仕入 / 繰越商品）
    explanation: 期首の在庫は当期に売ったと考え、仕入に加えて売上原価を計算します。
  - id: a2
    question: 期末商品棚卸高は 150,000 円である。
    answer: 繰越商品 150,000 / 仕入 150,000
    hint: くりしー（繰越商品 / 仕入）
    explanation: 売れ残った在庫は来期に売るので、仕入から除き、繰越商品（資産）にします。売上原価は 3,800,000 ＋ 120,000 − 150,000 ＝ 3,770,000 円になります。
  - id: a3
    question: 売掛金の期末残高 600,000 円に対して 2% の貸倒引当金を設定する（差額補充法）。
    answer: 貸倒引当金繰入 7,000 / 貸倒引当金 7,000
    hint: 600,000 × 2% ＝ 12,000 円から、試算表の残高を引きます。
    explanation: 必要な額 12,000 円から、すでにある 5,000 円を引いた 7,000 円を繰り入れます。
  - id: a4
    question: 減価償却を定額法・残存価額 0・間接法で行う。備品は取得原価 800,000 円・耐用年数 5 年、建物は取得原価 3,000,000 円・耐用年数 30 年（どちらも期首から使用）。2 つをまとめて 1 つの仕訳にする。
    answer: 減価償却費 260,000 / 減価償却累計額 260,000
    explanation: 備品 800,000 ÷ 5 ＝ 160,000 円、建物 3,000,000 ÷ 30 ＝ 100,000 円。合計 260,000 円です。
  - id: a5
    question: 保険料 72,000 円は、2025 年 12 月 1 日に 1 年分を前払いしたものである。未経過分を繰り延べる。
    answer: 前払費用 48,000 / 保険料 48,000
    hint: 4 月〜11 月の 8 か月分が来期の分です。
    explanation: 72,000 × 8/12 ＝ 48,000 円は来期の費用なので、前払費用（資産）にします。
  - id: a6
    question: 借入金 1,000,000 円の利息（年 3%）は、毎年 12 月末に 1 年分を後払いしている。2026 年 1 月〜3 月の 3 か月分を見越し計上する。
    answer: 支払利息 7,500 / 未払費用 7,500
    explanation: 1,000,000 × 3% × 3/12 ＝ 7,500 円。当期の費用なのにまだ払っていないので、未払費用（負債）にします。
  - id: a7
    question: 受取家賃 60,000 円は、2026 年 3 月 1 日に 3 か月分（3 月〜5 月）を前もって受け取ったものである。前受分を繰り延べる。
    answer: 受取家賃 40,000 / 前受収益 40,000
    explanation: 4 月と 5 月の 2 か月分 40,000 円は来期の収益なので、前受収益（負債）にします。
  - id: a8
    question: 消費税の処理を行う（仮受消費税等と仮払消費税等を相殺し、差額を未払消費税等とする）。
    answer: |
      仮受消費税等 560,000 / 仮払消費税等 380,000
      / 未払消費税等 180,000
    explanation: 560,000 − 380,000 ＝ 180,000 円を、申告・納付まで未払消費税等にします。
  - id: a9
    question: 当期の法人税等は 120,000 円と計算された。中間納付額 100,000 円は仮払法人税等で処理している。
    answer: |
      法人税等 120,000 / 仮払法人税等 100,000
      / 未払法人税等 20,000
    explanation: 中間納付した 100,000 円を差し引き、残りの 20,000 円を未払法人税等にします。当期純利益は 209,000 円になります。
