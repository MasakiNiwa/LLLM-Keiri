id: consolidation-worksheet
kind: consolidation
title: 連結精算表（支配獲得後 1 年目）
summary: 親会社と子会社（持分 80%）の個別財務諸表の合算から、投資と資本の相殺消去・のれん償却・非支配株主への按分・配当・内部取引・未実現利益・債権債務と貸倒引当金の修正まで、8 つの連結修正仕訳で連結財務諸表を作ります
level: 5
closingDate: '2026-03-31'
basis:
  - name: 連結財務諸表に関する会計基準（企業会計基準第 22 号）
  - name: 企業結合に関する会計基準（企業会計基準第 21 号）
asOf: '2026-10-01'
updated: '2026-10-18'
lessons:
  - consolidation-overview
  - consolidation-capital
  - consolidation-after-acquisition
  - consolidation-intercompany
  - consolidation-dividends
note: P 社は 2025 年 3 月 31 日に S 社の発行済株式の 80% を 4,000,000 円で取得し、支配を獲得した。そのときの S 社の純資産は、資本金 3,000,000 円・利益剰余金 1,500,000 円（資産・負債の時価と帳簿価額は同じ）。のれんは 10 年で定額法により償却する。下の試算表は、P 社と S 社の当期（2025 年 4 月 1 日〜2026 年 3 月 31 日）の個別の金額を合算したもの（単純合算）。利益剰余金は、期首の残高から当期に支払った配当を引いた額。税金と税効果は考えない。連結の財務諸表に出る「当期純利益」は、親会社株主に帰属する当期純利益になる。
trialBalance: |
  普通預金 4,040,000 / 買掛金 3,100,000
  売掛金 5,000,000 / 貸倒引当金 100,000
  商品 2,100,000 / 資本金 11,000,000
  子会社株式 4,000,000 / 利益剰余金 3,300,000
  土地 5,000,000 / 売上 23,000,000
  売上原価 16,000,000 / 受取配当金 160,000
  給料 4,460,000 /
  貸倒引当金繰入 60,000 /
adjustments:
  - id: a1
    question: 支配獲得日の S 社の資本と、P 社の投資（子会社株式）を相殺消去する。差額はのれん、S 社の資本のうち 20% は非支配株主持分にする。
    answer: |
      資本金 3,000,000 / 子会社株式 4,000,000
      利益剰余金 1,500,000 / 非支配株主持分 900,000
      のれん 400,000 /
    hint: のれん ＝ 投資 4,000,000 −（資本 4,500,000 × 80%）
    explanation: S 社の資本 4,500,000 円のうち P 社の持分は 3,600,000 円。投資 4,000,000 円との差額 400,000 円がのれん、残りの 20% の 900,000 円が非支配株主持分です。
  - id: a2
    question: のれんを償却する（10 年・定額法、当期は 1 年分）。
    answer: のれん償却 40,000 / のれん 40,000
    explanation: 400,000 ÷ 10 年 ＝ 40,000 円です。
  - id: a3
    question: S 社の当期純利益は 1,000,000 円だった。非支配株主の持分（20%）を按分する。
    answer: 非支配株主に帰属する当期純利益 200,000 / 非支配株主持分 200,000
    explanation: 子会社の利益のうち 20% は非支配株主のものなので、連結の利益から除き、非支配株主持分を増やします。
  - id: a4
    question: S 社は当期に 200,000 円の配当を支払い、P 社は 160,000 円を受取配当金に計上した。配当を修正する（S 社の配当は利益剰余金を減らして記帳されている）。
    answer: |
      受取配当金 160,000 / 利益剰余金 200,000
      非支配株主持分 40,000 /
    explanation: グループ内の配当は内部取引なので、P 社の受取配当金を消し、S 社の配当（利益剰余金の減少）を取り消します。非支配株主への配当 40,000 円は非支配株主持分を減らします。
  - id: a5
    question: 当期に P 社は S 社に商品 3,000,000 円を販売した（S 社の仕入は売上原価に含まれている）。内部取引を相殺消去する。
    answer: 売上 3,000,000 / 売上原価 3,000,000
    explanation: グループ内の売買は、外部への売上ではないので、P 社の売上と S 社の売上原価（仕入）を相殺します。
  - id: a6
    question: S 社の期末の商品のうち 500,000 円は P 社から仕入れたもので、P 社の利益率は売価の 20% である。未実現利益を消去する（ダウンストリーム）。
    answer: 売上原価 100,000 / 商品 100,000
    explanation: 500,000 × 20% ＝ 100,000 円は、まだグループの外に売れていない利益です。親会社が売ったもの（ダウンストリーム）なので、全額を親会社株主が負担します。
  - id: a7
    question: P 社の売掛金のうち 800,000 円は S 社に対するもので、S 社の買掛金に同じ額が計上されている。債権債務を相殺消去する。
    answer: 買掛金 800,000 / 売掛金 800,000
    explanation: グループ内の貸し借りは、連結では無かったことにします。
  - id: a8
    question: P 社は、S 社に対する売掛金 800,000 円にも 2% の貸倒引当金を設定していた。これを修正する。
    answer: 貸倒引当金 16,000 / 貸倒引当金繰入 16,000
    explanation: 相殺した売掛金に対する貸倒引当金 16,000 円も取り消します。連結の当期純利益（親会社株主に帰属）は 2,156,000 円、非支配株主持分は 1,060,000 円（S 社の期末の純資産 5,300,000 円の 20%）になります。
